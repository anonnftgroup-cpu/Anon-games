<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Shadow Dodge · ANON NFTs</title>
<meta name="description" content="Shadow Dodge: pick your ANON NFT character and dodge the flying blocks. Free, no sign-up.">
<link rel="icon" href="../assets/logo.webp">
<link rel="stylesheet" href="../assets/nft/kit.css">
<link rel="stylesheet" href="../assets/play/play.css">
</head>
<body>
<header><div class="top">
  <div class="brand"><a class="back-btn" href="../" aria-label="Back to ANON Arcade">&larr; Arcade</a><img src="../assets/logo.webp" alt=""><h1>SHADOW DODGE</h1></div>
  <div class="top-r"><button class="icon-btn" id="lbBtn" aria-label="Leaderboard">🏆</button><button class="icon-btn" id="menuBtn" aria-label="Menu">↻</button></div>
</div></header>
<section class="view on" id="setup">
  <img class="hero" id="hero" alt="ANON NFTs artwork">
  <div class="lbl">Choose your ANON</div>
  <div class="chars five" id="artPick"></div>
  <button class="go" id="goBtn">PLAY</button>
  <p class="howto">Drag anywhere to move your ANON (or use the arrow keys / WASD). Blocks fly in from every side and get faster. One hit and it's over. Survive as long as you can!</p>
  <div class="nick" id="nick"></div>
</section>
<section class="view" id="play">
  <div class="hud"><span id="tm">⏱ 0.0s</span><span id="best">🏆 0.0s</span></div>
  <div class="stage"><canvas id="cv"></canvas><div class="tap" id="msg"></div></div>
  <div class="bar"><button id="againBtn">Restart</button><button id="setBtn">Change ANON</button></div>
</section>
<script src="../shared/leaderboard.js"></script>
<script src="../shared/newsletter.js"></script>
<script src="../assets/nft/kit.js"></script>
<script src="../assets/play/play.js"></script>
<script>
'use strict';
const { $, ls, modal, post, openLB, gameOver, art, ART } = AK;
const GAME = 'shadow-dodge', TITLE = 'Shadow Dodge';
const NAMES = Object.fromEntries(ART.map(a => [a.id, a.name.replace(/^ANON /, '')]));
const pref = ls.get('anonDodge.pref', { art: 'anon', best: 0 });
const show = id => document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
const setHero = () => $('#hero').src = art(pref.art).cover;
AK.picker($('#artPick'), pref.art, id => { pref.art = id; ls.set('anonDodge.pref', pref); setHero(); });
setHero(); AK.nickLine($('#nick'));
let C = null, S = null, ME = null, BG = null; const SPR = {};
AP.img('../assets/nft/c-anon.webp').then(i => BG = i);
function mkSprite(im) { const d = 2, R = 48, c = document.createElement('canvas'); c.width = c.height = R * 2 * d; const x = c.getContext('2d'); x.scale(d, d);
  x.save(); x.beginPath(); x.arc(R, R, R - 4, 0, 7); x.clip(); if (im) AP.cover(x, im, 4, 4, R * 2 - 8, R * 2 - 8); x.restore();
  x.lineWidth = 5; x.strokeStyle = '#f3d77a'; x.beginPath(); x.arc(R, R, R - 3, 0, 7); x.stroke(); return c; }
function blockSprite() { const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, s, s); g.addColorStop(0, '#ff6b7f'); g.addColorStop(.55, '#d4143f'); g.addColorStop(1, '#4a0614'); x.fillStyle = g; AP.rr(x, 2, 2, s - 4, s - 4, 8); x.fill();
  x.strokeStyle = '#f3d77a'; x.lineWidth = 3; x.stroke(); x.fillStyle = 'rgba(255,255,255,.25)'; AP.rr(x, 8, 7, s - 16, 10, 4); x.fill(); return c; }
SPR.block = blockSprite();
async function newRun() {
  const a = art(pref.art); ME = SPR[a.id] || (SPR[a.id] = mkSprite(await AP.img(a.img)));
  show('play'); if (!C) C = AP.canvas($('#cv'), 0, () => draw()); else C.fit();
  const r = Math.max(16, Math.min(24, C.w / 17));
  S = { t: 0, x: C.w / 2, y: C.h * .62, r, b: [], next: .8, over: false, dodged: 0, count: 2.2, vx: 0, vy: 0, art: a.id };
  $('#best').textContent = '🏆 ' + (pref.best || 0).toFixed(1) + 's'; hud(); L.start();
}
const hud = () => { $('#tm').textContent = '⏱ ' + S.t.toFixed(1) + 's'; };
const keyv = { x: 0, y: 0 }, held = new Set();
function spawn() {
  const lvl = Math.min(1, S.t / 75), side = AP.ri(0, 3), sz = (16 + AP.rnd() * 22) * (C.w / 390 * .6 + .4), sp = (130 + 260 * lvl) * (Math.min(C.w, C.h) / 400) * (.8 + AP.rnd() * .4);
  let x, y; if (side === 0) { x = AP.rnd() * C.w; y = -sz; } else if (side === 1) { x = C.w + sz; y = AP.rnd() * C.h; } else if (side === 2) { x = AP.rnd() * C.w; y = C.h + sz; } else { x = -sz; y = AP.rnd() * C.h; }
  const tx = S.x + (AP.rnd() - .5) * C.w * .5, ty = S.y + (AP.rnd() - .5) * C.h * .4, d = Math.hypot(tx - x, ty - y) || 1;
  S.b.push({ x, y, s: sz, vx: (tx - x) / d * sp, vy: (ty - y) / d * sp, rot: AP.rnd() * 6, vr: (AP.rnd() - .5) * 4, inside: false });
}
function step(dt) {
  if (!S || S.over) return;
  if (S.count > 0) { S.count -= dt; $('#msg').textContent = S.count > .3 ? 'Get ready… ' + Math.ceil(S.count - .3) : 'DODGE!'; if (S.count <= 0) $('#msg').textContent = ''; return; }
  S.t += dt; S.next -= dt;
  if (S.next <= 0) { spawn(); const lvl = Math.min(1, S.t / 75); S.next = Math.max(.18, .85 - .67 * lvl) * (.7 + AP.rnd() * .6); }
  const ks = Math.min(C.w, C.h) * 1.1; if (keyv.x || keyv.y) { S.x += keyv.x * ks * dt; S.y += keyv.y * ks * dt; }
  S.x = Math.max(S.r, Math.min(C.w - S.r, S.x)); S.y = Math.max(S.r, Math.min(C.h - S.r, S.y));
  for (const b of S.b) { b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt; const h = b.s / 2;
    if (b.x > -h && b.x < C.w + h && b.y > -h && b.y < C.h + h) b.inside = true;
    // circle vs (unrotated, slightly shrunk) square: forgiving hitbox
    const k = h * .86, cx = Math.max(b.x - k, Math.min(S.x, b.x + k)), cy = Math.max(b.y - k, Math.min(S.y, b.y + k));
    if (Math.hypot(S.x - cx, S.y - cy) < S.r * .82) { crash(b); return; } }
  const m = 80; const keep = []; for (const b of S.b) { if (b.x < -m || b.x > C.w + m || b.y < -m || b.y > C.h + m) { if (b.inside) S.dodged++; } else keep.push(b); } S.b = keep;
  hud();
}
function draw() {
  if (!C) return; const x = C.x, W = C.w, H = C.h;
  x.fillStyle = '#05070a'; x.fillRect(0, 0, W, H);
  if (BG) { x.globalAlpha = .3; const k = Math.max(W / BG.width, H / BG.height); x.drawImage(BG, (W - BG.width * k) / 2, (H - BG.height * k) / 2, BG.width * k, BG.height * k); x.globalAlpha = 1; }
  x.strokeStyle = 'rgba(212,175,55,.08)'; x.lineWidth = 1; const g = 40, off = S ? (S.t * 20) % g : 0; x.beginPath();
  for (let X = -off; X < W; X += g) { x.moveTo(X, 0); x.lineTo(X, H); } for (let Y = -off; Y < H; Y += g) { x.moveTo(0, Y); x.lineTo(W, Y); } x.stroke();
  if (!S) return;
  for (const b of S.b) { x.save(); x.translate(b.x, b.y); x.rotate(b.rot); x.globalAlpha = .25; x.drawImage(SPR.block, -b.s / 2 - b.vx * .03, -b.s / 2 - b.vy * .03, b.s, b.s); x.globalAlpha = 1; x.drawImage(SPR.block, -b.s / 2, -b.s / 2, b.s, b.s); x.restore(); }
  if (ME) { x.save(); x.shadowColor = S.over ? '#ff3d3d' : '#ff3d9a'; x.shadowBlur = 16; x.drawImage(ME, S.x - S.r, S.y - S.r, S.r * 2, S.r * 2); x.restore(); }
  if (S.over) { x.strokeStyle = '#ff5a5a'; x.lineWidth = 4; x.beginPath(); x.arc(S.x, S.y, S.r + 6, 0, 7); x.stroke(); }
}
const L = AP.loop(step, draw); L.onHide = () => { if (S && !S.over && S.count <= 0) { S.count = 2.2; } };
function crash() {
  S.over = true; L.stop(); draw(); if (navigator.vibrate) navigator.vibrate([50, 40, 80]);
  const t = S.t, sc = Math.floor(t * 10), secs = Math.max(1, Math.ceil(t)), a = art(S.art), pb = t > (pref.best || 0);
  if (pb) { pref.best = +t.toFixed(1); ls.set('anonDodge.pref', pref); }
  ((S) => setTimeout(() => { modal({ art: a.img, title: pb ? 'New best! 🏆' : 'Hit! 💥', text: `<b>${a.name}</b> survived <b>${t.toFixed(1)}s</b> and dodged ${S.dodged} blocks.`, lb: sc >= 10,
    buttons: [['PLAY AGAIN', () => newRun()], ['Leaderboard', () => openLB(GAME, TITLE, NAMES, 'dodges'), 1], ['Change ANON', () => show('setup'), 1]] });
    if (sc >= 10) post(GAME, sc, secs, S.dodged, S.art); }, 600))(S); // snapshot: a quick new game must not change this post
  gameOver();
}
// controls: relative drag anywhere on the canvas
const cv = $('#cv'); let drag = null;
cv.addEventListener('pointerdown', e => { if (!S || S.over) return; drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag || !S || S.over) return; const k = 1.25; S.x += (e.clientX - drag.x) * k; S.y += (e.clientY - drag.y) * k; drag.x = e.clientX; drag.y = e.clientY;
  S.x = Math.max(S.r, Math.min(C.w - S.r, S.x)); S.y = Math.max(S.r, Math.min(C.h - S.r, S.y)); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => drag = null));
const K = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] };
const recompute = () => { keyv.x = 0; keyv.y = 0; held.forEach(k => { keyv.x += K[k][0]; keyv.y += K[k][1]; }); const n = Math.hypot(keyv.x, keyv.y); if (n) { keyv.x /= n; keyv.y /= n; } };
window.addEventListener('keydown', e => { const k = K[e.key] ? e.key : K[e.key.toLowerCase()] ? e.key.toLowerCase() : null; if (!k || !$('#play').classList.contains('on') || document.querySelector('.modal.show,.alb-ov,.anw-ov')) return; e.preventDefault(); held.add(k); recompute(); });
window.addEventListener('keyup', e => { held.delete(e.key); held.delete(e.key.toLowerCase()); recompute(); });
$('#goBtn').onclick = () => newRun(); $('#againBtn').onclick = () => { L.stop(); newRun(); };
$('#setBtn').onclick = $('#menuBtn').onclick = () => { L.stop(); if (S) S.over = true; show('setup'); };
$('#lbBtn').onclick = () => openLB(GAME, TITLE, NAMES, 'dodges');
window.G = { state: () => S, newRun, step, spawn, L, C: () => C, setArt: id => { pref.art = id; } };
</script>
</body>
</html>

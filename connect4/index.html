<style>
:root{--gold:#d4af37;--gold2:#f3d77a;--pink:#ff3d9a;--pink2:#ff8cc4;--green:#2bff88;--cell:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;color:#e9e3cf;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,61,154,.09),transparent 62%),
    linear-gradient(rgba(3,5,8,.6),rgba(3,5,8,.9)),url(../solitaire/assets/bg.jpg) center/cover no-repeat,#05070a;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;color:inherit}
header{padding:calc(6px + env(safe-area-inset-top)) 10px 2px;max-width:560px;width:100%;margin:0 auto;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px rgba(212,175,55,.6),0 0 12px rgba(255,61,154,.25);flex:none}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(14px,4.3vw,26px);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#fff3c4 0%,#e9c858 45%,#b48a25 75%,#f5dc85 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,61,154,.2))}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(212,175,55,.6);background:rgba(0,0,0,.45);color:var(--gold2);font-weight:800;font-size:16px;flex:none;padding:0}
.top-r{display:flex;gap:6px;flex:none}
.back-btn{display:none;align-items:center;gap:4px;height:36px;padding:0 12px 0 9px;border-radius:18px;border:1px solid rgba(212,175,55,.7);background:rgba(0,0,0,.55);color:var(--gold2);font-weight:800;font-size:13px;letter-spacing:.04em;text-decoration:none;flex:none;white-space:nowrap;box-shadow:0 0 10px rgba(43,255,136,.12)}
.in-hub .back-btn{display:inline-flex}
.in-hub .brand img{display:none}
.in-hub h1{font-size:clamp(14px,4.3vw,24px);letter-spacing:.06em}
.view{flex:1;min-height:0;display:none;flex-direction:column;width:100%;max-width:560px;margin:0 auto}
.view.on{display:flex}
/* setup */
#setup{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 12px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9d9580;margin:12px 2px 6px;text-align:center}
.seg{display:flex;gap:6px;padding:4px;border:1px solid rgba(212,175,55,.35);border-radius:14px;background:rgba(0,0,0,.4)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:#b9a35c;font-weight:800;font-size:14px;letter-spacing:.03em}
.seg button.on{background:linear-gradient(180deg,#e9c858,#a47c1f);color:#120e02;box-shadow:0 0 12px rgba(243,215,122,.3)}
.seg.pinkseg button.on{background:linear-gradient(180deg,#ff5aab,#c41f73);color:#fff;box-shadow:0 0 12px rgba(255,61,154,.35)}
.picker-title{text-align:center;font-family:Georgia,serif;color:var(--gold2);font-size:17px;letter-spacing:.05em;margin:14px 0 2px}
.picker-title.p2{color:var(--pink2)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ch{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 7px;border-radius:14px;border:1px solid rgba(212,175,55,.3);background:rgba(0,0,0,.42);text-align:center;min-width:0}
.ch .disc{width:min(68px,19vw);height:min(68px,19vw)}
.ch span{font-size:11.5px;line-height:1.2;color:#d9d2bc;font-weight:700;min-height:28px;display:flex;align-items:center}
.ch.sel1{border-color:var(--gold2);background:rgba(212,175,55,.14);box-shadow:0 0 14px rgba(243,215,122,.3)}
.ch.sel2{border-color:var(--pink2);background:rgba(255,61,154,.12);box-shadow:0 0 14px rgba(255,61,154,.3)}
.ch .tag{position:absolute;top:5px;left:5px;font-size:10px;font-weight:900;padding:2px 6px;border-radius:8px;background:var(--gold2);color:#140f02}
.ch.sel2 .tag{background:var(--pink);color:#fff}
.ch:disabled{opacity:.5}
.vsline{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;font-size:13px;color:#b9b19a}
.vsline .disc{width:40px;height:40px}
.vsline b{color:var(--pink2)}
.dice{border:1px solid rgba(255,140,196,.5);background:rgba(0,0,0,.4);border-radius:16px;padding:4px 10px;font-size:12px;color:var(--pink2);font-weight:800}
.go{display:block;width:100%;min-height:50px;margin-top:14px;border-radius:14px;border:1px solid #ff8cc4;background:linear-gradient(180deg,#ff5aab,#c41f73);color:#fff;font-weight:900;font-size:17px;letter-spacing:.08em;box-shadow:0 0 18px rgba(255,61,154,.35)}
.go:active{transform:translateY(1px)}
/* discs */
.disc{border-radius:50%;background:#0b0d10 center/cover no-repeat;box-shadow:0 0 0 3px #e2bf52,0 0 0 4px #7a5d14,inset 0 0 0 2px rgba(255,240,180,.55),0 3px 6px rgba(0,0,0,.6)}
.disc.p2{box-shadow:0 0 0 3px #ff5aab,0 0 0 4px #8c1450,inset 0 0 0 2px rgba(255,210,235,.6),0 3px 6px rgba(0,0,0,.6)}
/* play */
.players{display:flex;align-items:center;gap:8px;padding:6px 10px 2px}
.pl{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:14px;border:1px solid rgba(212,175,55,.22);background:rgba(0,0,0,.4);transition:box-shadow .2s,border-color .2s}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl .disc{width:34px;height:34px;flex:none}
.pl .nm{min-width:0}
.pl .nm b{display:block;font-size:13px;color:#f1ead4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm i{display:block;font-style:normal;font-size:10.5px;color:#9d9580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.turn{border-color:var(--gold2);box-shadow:0 0 14px rgba(243,215,122,.35)}
.pl.r.turn{border-color:var(--pink2);box-shadow:0 0 14px rgba(255,61,154,.35)}
.vs{font-family:Georgia,serif;color:#9d9580;font-size:12px}
.status{text-align:center;font-size:13px;color:var(--gold2);min-height:18px;margin-top:4px;letter-spacing:.03em}
.status.p2{color:var(--pink2)}
.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 8px}
#board{position:relative;width:calc(var(--cell)*7 + 16px);padding:calc(var(--cell)*.9) 8px 8px;touch-action:manipulation}
.frame{position:absolute;left:0;right:0;bottom:0;top:calc(var(--cell)*.9 - 8px);border-radius:16px;background:linear-gradient(180deg,#14161c,#0a0b0f);
  border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.1),0 0 30px rgba(255,61,154,.12),inset 0 0 22px rgba(0,0,0,.8)}
.grid{position:relative;display:grid;grid-template-columns:repeat(7,var(--cell));grid-template-rows:repeat(6,var(--cell))}
.slot{position:relative;display:flex;align-items:center;justify-content:center}
.slot::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#030406,#0c0e12);box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 0 0 1px rgba(212,175,55,.18)}
.slot .disc{position:relative;width:84%;height:84%;z-index:1}
.disc.win{animation:glow 1s ease-in-out infinite alternate;z-index:2}
@keyframes glow{from{box-shadow:0 0 0 3px #fff3c4,0 0 10px 4px rgba(243,215,122,.8)}to{box-shadow:0 0 0 3px #fff3c4,0 0 22px 9px rgba(255,61,154,.75);transform:scale(1.08)}}
.grid.done .disc:not(.win){filter:brightness(.45) saturate(.6)}
.cols{position:absolute;left:8px;right:8px;top:0;bottom:8px;display:grid;grid-template-columns:repeat(7,1fr);z-index:3}
.col{border:0;background:transparent;padding:0;border-radius:10px}
.col.hover{background:linear-gradient(180deg,rgba(243,215,122,.14),rgba(243,215,122,.02))}
.ghost{position:absolute;top:calc(var(--cell)*.05);width:calc(var(--cell)*.78);height:calc(var(--cell)*.78);opacity:.0;transition:left .12s,opacity .15s;pointer-events:none;z-index:4}
.ghost.on{opacity:.9}
.toolbar{display:flex;gap:7px;padding:4px 10px calc(8px + env(safe-area-inset-bottom));flex:none}
.btn{flex:1;min-height:44px;border-radius:11px;border:1px solid rgba(212,175,55,.75);background:linear-gradient(180deg,#1d1a0d,#0a0905);color:var(--gold2);font-weight:800;letter-spacing:.05em;font-size:14px}
.btn:disabled{opacity:.35}
.btn.pri{background:linear-gradient(180deg,#ff5aab,#c41f73);border-color:#ff8cc4;color:#fff}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
footer{text-align:center;font-size:10.5px;color:#7d776a;padding:0 8px calc(4px + env(safe-area-inset-bottom));letter-spacing:.04em;flex:none}
footer a{color:#b9a35c;text-decoration:none}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:rgba(10,10,10,.92);border:1px solid var(--gold);color:var(--gold2);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4500;white-space:nowrap}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.6)}
.overlay.show{display:flex}
.panel{position:relative;width:100%;max-width:360px;max-height:calc(100% - 8px);overflow:auto;background:rgba(6,8,11,.97);border:1px solid var(--gold);border-radius:16px;padding:16px;text-align:center;
  box-shadow:0 0 0 4px rgba(212,175,55,.08),0 0 40px rgba(255,61,154,.16);animation:popin .3s ease}
@keyframes popin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:4px 0 6px;font-family:Georgia,serif;color:var(--gold2);letter-spacing:.08em;font-size:21px}
.panel p{margin:6px 0;font-size:14px;line-height:1.45;color:#d9d2bc;text-align:left}
.x{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(212,175,55,.5);background:rgba(0,0,0,.4);color:var(--gold2);font-size:15px}
.res-disc{width:92px;height:92px;margin:6px auto 4px}
.res-sub{color:#b9b19a;font-size:13.5px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.stat{border:1px solid rgba(212,175,55,.3);border-radius:9px;padding:6px 2px;background:rgba(0,0,0,.4)}
.stat b{display:block;font-size:19px;color:var(--gold2);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:9.5px;letter-spacing:.08em;color:#9d9580;text-transform:uppercase}
.row{display:flex;gap:8px;margin-top:12px}
.lbmsg{margin-top:10px;font-size:12.5px;color:#9d9580;min-height:17px;line-height:1.35}
.lbmsg.ok{color:var(--green)}
.lbmsg button{background:none;border:0;color:var(--gold);text-decoration:underline;font-size:12.5px;padding:2px 4px}
.rec{font-size:12px;color:#9d9580;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="back-btn" id="backBtn" href="../" aria-label="Back to ANON Arcade">&larr; Arcade</a>
    <div class="brand"><img src="../assets/logo.webp" alt="ANON NFTs logo"><h1>ANON FOUR IN A ROW</h1></div>
    <div class="top-r">
      <button class="icon-btn" id="lbBtn" aria-label="Leaderboard">&#127942;</button>
      <button class="icon-btn" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </div>
</header>

<section class="view" id="setup" aria-label="Game setup">
  <div class="lbl">Mode</div>
  <div class="seg" id="modeSeg"><button data-mode="cpu" type="button">🤖 vs Computer</button><button data-mode="2p" type="button">👥 2 Players</button></div>
  <div id="diffBox"><div class="lbl">Difficulty</div>
    <div class="seg pinkseg" id="diffSeg"><button data-diff="easy" type="button">Easy</button><button data-diff="medium" type="button">Medium</button><button data-diff="hard" type="button">Hard</button></div></div>
  <div class="picker-title" id="pickTitle">Choose your ANON</div>
  <div class="chars" id="chars"></div>
  <div class="vsline" id="vsLine"></div>
  <button class="go" id="goBtn" type="button">PLAY ▶</button>
</section>

<section class="view" id="play" aria-label="Game">
  <div class="players">
    <div class="pl" id="pl1"><div class="disc"></div><div class="nm"><b></b><i></i></div></div>
    <span class="vs">vs</span>
    <div class="pl r" id="pl2"><div class="disc p2"></div><div class="nm"><b></b><i></i></div></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="boardwrap" id="bw">
    <div id="board">
      <div class="frame"></div>
      <div class="disc ghost" id="ghost"></div>
      <div class="grid" id="grid"></div>
      <div class="cols" id="cols"></div>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn" id="newBtn" type="button">New</button>
    <button class="btn" id="undoBtn" type="button">Undo</button>
    <button class="btn" id="againBtn" type="button">Restart</button>
  </div>
</section>
<footer>ANON NFTs · <a href="https://anonnfts.com" target="_blank" rel="noopener">anonnfts.com</a> · Art from ANON NFTs collections</footer>
<div id="toast"></div>
<div class="overlay" id="modal"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="../shared/leaderboard.js"></script>
<script src="../shared/newsletter.js"></script>
<script src="engine.js"></script>
<script>
(() => {
'use strict';
const GAME = 'connect4', TITLE = 'ANON Four in a Row';
const E = window.ANON_C4_ENGINE, W = 7, H = 6;
const CHARS = [
  { id: 'anon',   name: 'ANON Originals', img: 'chars/anon.webp' },
  { id: 'apes',   name: 'ANON Apes',               img: 'chars/apes.webp' },
  { id: 'royals', name: 'ANON Apes King & Queen',  img: 'chars/royals.webp' },
  { id: 'aces',   name: 'Aces by BESC',            img: 'chars/aces.webp' },
  { id: 'ghost',  name: 'Ghost Dead Hand Aces',    img: 'chars/ghost.webp' },
  { id: 'skulls', name: 'ANON Skulls',             img: 'chars/skulls.webp' },
  { id: 'eyes',   name: 'ANON Eyes',               img: 'chars/eyes.webp' },
  { id: 'lake',   name: 'Lake District NFTs',      img: 'chars/lake.webp' },
  { id: 'venge',  name: 'Vengeance',               img: 'chars/venge.webp' }
];
const BASE = { easy: 100, medium: 300, hard: 600 }, DIFF_NAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
const score = (diff, myMoves) => BASE[diff] + (22 - myMoves) * 10;
const K_SET = 'anonC4.v1.setup', K_GAME = 'anonC4.v1.game', K_STATS = 'anonC4.v1.stats', K_SEEN = 'anonC4.v1.seenHelp';
const FAST = !!window.ANON_C4_FAST;                     // test hook: quicker animations
const AI_MIN_MS = FAST ? 60 : 380;
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const charById = id => CHARS.find(c => c.id === id) || CHARS[0];
const toast = (() => { let t; return (m, ms) => { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(t); t = setTimeout(() => e.classList.remove('show'), ms || 1600); }; })();
const IN_HUB = /[?&]hub=1\b/.test(location.search) || (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
if (IN_HUB) document.documentElement.classList.add('in-hub');
const setDisc = (d, ch) => { d.style.backgroundImage = 'url(' + ch.img + ')'; d.setAttribute('role', 'img'); d.setAttribute('aria-label', ch.name); };

/* ---------- setup ---------- */
let setup = Object.assign({ mode: 'cpu', diff: 'medium', p1: 'anon', p2: 'venge' }, ls.get(K_SET, {}));
let pickStep = 1;                                         // 2P: which player is choosing
function randomOther(id) { const o = CHARS.filter(c => c.id !== id); return o[Math.floor(Math.random() * o.length)].id; }
if (setup.p1 === setup.p2) setup.p2 = randomOther(setup.p1);
function renderSetup() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === setup.mode));
  document.querySelectorAll('#diffSeg button').forEach(b => b.classList.toggle('on', b.dataset.diff === setup.diff));
  $('#diffBox').style.display = setup.mode === 'cpu' ? '' : 'none';
  const t = $('#pickTitle'); const two = setup.mode === '2p';
  t.textContent = two ? (pickStep === 1 ? 'Player 1: choose your ANON' : 'Player 2: choose your ANON') : 'Choose your ANON';
  t.classList.toggle('p2', two && pickStep === 2);
  const box = $('#chars'); box.innerHTML = '';
  CHARS.forEach(ch => {
    const b = el('button', 'ch'); b.type = 'button'; b.dataset.id = ch.id;
    const d = el('div', 'disc' + (ch.id === setup.p2 && two ? ' p2' : '')); setDisc(d, ch); b.appendChild(d); b.appendChild(el('span', '', ch.name));
    if (ch.id === setup.p1) { b.classList.add('sel1'); b.appendChild(el('i', 'tag', two ? 'P1' : 'YOU')); }
    if (ch.id === setup.p2) { b.classList.add('sel2'); b.appendChild(el('i', 'tag', two ? 'P2' : 'CPU')); }
    b.setAttribute('aria-pressed', String(ch.id === setup.p1 || (two && ch.id === setup.p2)));
    b.onclick = () => pick(ch.id);
    box.appendChild(b);
  });
  const v = $('#vsLine'); v.innerHTML = '';
  if (!two) { const d = el('div', 'disc p2'); setDisc(d, charById(setup.p2));
    v.appendChild(el('span', '', 'Computer plays as')); v.appendChild(d); v.appendChild(el('b', '', charById(setup.p2).name));
    const r = el('button', 'dice', '🎲'); r.type = 'button'; r.setAttribute('aria-label', 'Give the computer another character'); r.onclick = () => { setup.p2 = randomOther(setup.p1); saveSetup(); renderSetup(); }; v.appendChild(r); }
  else v.appendChild(el('span', '', pickStep === 1 ? 'Tap a character for Player 1, then one for Player 2.' : 'Player 2 picks a different ANON.'));
  $('#goBtn').textContent = two && pickStep === 1 ? 'NEXT: PLAYER 2 ▶' : 'PLAY ▶';
}
function pick(id) {
  if (setup.mode === 'cpu') { setup.p1 = id; if (setup.p2 === id) setup.p2 = randomOther(id); }
  else if (pickStep === 1) { setup.p1 = id; if (setup.p2 === id) setup.p2 = randomOther(id); pickStep = 2; }
  else { if (id === setup.p1) { toast('Player 1 has that one. Pick another ANON'); return; } setup.p2 = id; }
  saveSetup(); renderSetup();
}
const saveSetup = () => ls.set(K_SET, { mode: setup.mode, diff: setup.diff, p1: setup.p1, p2: setup.p2 });
$('#modeSeg').onclick = e => { const m = e.target.closest('button'); if (!m) return; setup.mode = m.dataset.mode; pickStep = 1; saveSetup(); renderSetup(); };
$('#diffSeg').onclick = e => { const m = e.target.closest('button'); if (!m) return; setup.diff = m.dataset.diff; saveSetup(); renderSetup(); };
$('#goBtn').onclick = () => { if (setup.mode === '2p' && pickStep === 1) { pickStep = 2; renderSetup(); return; } startGame(); };
function showView(v) { $('#setup').classList.toggle('on', v === 'setup'); $('#play').classList.toggle('on', v === 'play'); if (v === 'play') fit(); }

/* ---------- board UI ---------- */
const grid = $('#grid'), cells = [];                       // cells[c][r], r = 0 bottom
for (let r = H - 1; r >= 0; r--) for (let c = 0; c < W; c++) { const s = el('div', 'slot'); s.dataset.c = c; s.dataset.r = r; grid.appendChild(s); (cells[c] = cells[c] || [])[r] = s; }
const colBtns = [];
for (let c = 0; c < W; c++) { const b = el('button', 'col'); b.type = 'button'; b.dataset.c = c; b.setAttribute('aria-label', 'Drop in column ' + (c + 1));
  b.addEventListener('click', () => humanMove(c));
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hover(c); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover(-1); });
  $('#cols').appendChild(b); colBtns.push(b); }
function fit() {
  const bw = $('#bw'), w = Math.min(bw.clientWidth - 16, 470) - 16, h = bw.clientHeight - 8;
  const cell = Math.floor(Math.max(30, Math.min(w / 7, (h - 16) / 6.9, 64)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
addEventListener('resize', fit);
function hover(c) {
  colBtns.forEach((b, i) => b.classList.toggle('hover', i === c && canHumanMove()));
  const g = $('#ghost');
  if (c < 0 || !canHumanMove()) { g.classList.remove('on'); return; }
  const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
  setDisc(g, charById(turnChar())); g.classList.toggle('p2', S.turn === -1);
  g.style.left = (8 + c * cell + cell * .11) + 'px'; g.classList.add('on');
}

/* ---------- game state ---------- */
let S = null, G = null, busy = false, aiToken = 0;
const stats = () => Object.assign({ easy: [0, 0, 0], medium: [0, 0, 0], hard: [0, 0, 0], twoP: 0 }, ls.get(K_STATS, {}));
function newState() { return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), mode: setup.mode, diff: setup.diff, p1: setup.p1, p2: setup.p2, moves: [], turn: 1, start: 0, end: 0, result: null, lb: null, counted: false, starter: 1 }; }
const turnChar = () => S.turn === 1 ? S.p1 : S.p2;
const isCpuTurn = () => S.mode === 'cpu' && S.turn === -1 && !S.result;
const canHumanMove = () => S && !S.result && !busy && !isCpuTurn();
function save() { ls.set(K_GAME, S); }
function startGame(keepStarter) {
  aiToken++; busy = false;
  const prev = S; S = newState();
  if (S.mode === '2p' && keepStarter && prev && prev.mode === '2p') S.starter = -prev.starter;   // 2P rematch: the other player starts
  S.turn = S.starter;
  G = new E.Game(); save(); renderPlay(); showView('play'); closeModal();
  if (isCpuTurn()) aiTurn();
}
function renderPlay() {
  const a = charById(S.p1), b = charById(S.p2);
  setDisc($('#pl1 .disc'), a); setDisc($('#pl2 .disc'), b);
  $('#pl1 b').textContent = S.mode === 'cpu' ? 'You' : 'Player 1'; $('#pl1 i').textContent = a.name;
  $('#pl2 b').textContent = S.mode === 'cpu' ? 'Computer · ' + DIFF_NAME[S.diff] : 'Player 2'; $('#pl2 i').textContent = b.name;
  $('#undoBtn').style.display = S.mode === '2p' ? '' : 'none';
  for (let c = 0; c < W; c++) for (let r = 0; r < H; r++) cells[c][r].innerHTML = '';
  grid.classList.remove('done');
  G = new E.Game(); let p = S.starter;
  for (const c of S.moves) { const r = G.play(c, p); cells[c][r].appendChild(makeDisc(p)); p = -p; }
  if (S.result && S.result.cells) highlight(S.result.cells);
  paintTurn();
}
function makeDisc(p) { const d = el('div', 'disc' + (p === -1 ? ' p2' : '')); setDisc(d, charById(p === 1 ? S.p1 : S.p2)); return d; }
function paintTurn() {
  $('#pl1').classList.toggle('turn', !S.result && S.turn === 1); $('#pl2').classList.toggle('turn', !S.result && S.turn === -1);
  const st = $('#status'); st.classList.toggle('p2', !S.result && S.turn === -1);
  if (S.result) st.textContent = S.result.winner === 0 ? 'Draw! The board is full.' : (S.mode === 'cpu' ? (S.result.winner === 1 ? 'You win! 👑' : 'The computer wins this one.') : (S.result.winner === 1 ? 'Player 1 wins! 👑' : 'Player 2 wins! 👑'));
  else if (isCpuTurn()) st.textContent = 'Computer is thinking…';
  else st.textContent = S.mode === 'cpu' ? 'Your move: tap a column' : (S.turn === 1 ? 'Player 1' : 'Player 2') + ': tap a column';
  $('#undoBtn').disabled = !(S.mode === '2p' && S.moves.length && !busy);
}
function dropAnim(d, r) {
  const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
  const dist = (H - r) * cell + cell * .5, dur = (FAST ? 40 : 160) + (H - r) * (FAST ? 10 : 45);
  if (!d.animate) return Promise.resolve();
  const a = d.animate([{ transform: `translateY(${-dist}px)` }, { transform: 'translateY(0)', offset: .78 }, { transform: `translateY(${-cell * .12}px)`, offset: .89 }, { transform: 'translateY(0)' }],
    { duration: dur * 1.25, easing: 'cubic-bezier(.45,0,1,1)' });
  return new Promise(res => { a.onfinish = res; a.oncancel = res; setTimeout(res, dur * 1.25 + 80); });
}
async function place(c) {
  const p = S.turn, r = G.play(c, p);
  if (!S.start) S.start = Date.now();
  S.moves.push(c); S.turn = -p;
  const d = makeDisc(p); cells[c][r].appendChild(d);
  busy = true; hover(-1); paintTurn(); save();
  await dropAnim(d, r);
  busy = false;
  const w = G.winLine();
  if (w) finish(w.player, w.cells); else if (G.full()) finish(0, null);
  paintTurn();
}
function humanMove(c) {
  if (!canHumanMove()) return;
  if (!G.canPlay(c)) { toast('That column is full'); return; }
  place(c).then(() => { if (isCpuTurn()) aiTurn(); });
}
/* computer player: Web Worker when available, main thread otherwise */
let worker = null, wid = 0; const waiting = {};
try { worker = new Worker('engine.js'); worker.onmessage = e => { const f = waiting[e.data.id]; if (f) { delete waiting[e.data.id]; f(e.data); } }; worker.onerror = () => { worker = null; }; } catch (e) { worker = null; }
function think(moves, color, level) {
  if (worker) return new Promise(res => { const id = ++wid; waiting[id] = res;
    setTimeout(() => { if (waiting[id]) { delete waiting[id]; worker = null; res(E.chooseMove(E.Game.fromMoves(moves), color, { level })); } }, 6000);
    worker.postMessage({ id, moves, color, level }); });
  return new Promise(res => setTimeout(() => res(E.chooseMove(E.Game.fromMoves(moves), color, { level })), 30));
}
const lastAi = [];
async function aiTurn() {
  const tok = ++aiToken; busy = true; paintTurn();
  const t0 = performance.now();
  const color = S.starter === 1 ? -1 : 1;                 // engine colours follow move order
  const m = await think(S.moves.slice(), color, S.diff);
  const wait = AI_MIN_MS - (performance.now() - t0); if (wait > 0) await new Promise(r => setTimeout(r, wait));
  if (tok !== aiToken || !S || S.result) return;
  lastAi.push({ ms: Math.round(performance.now() - t0), think: Math.round(m.ms), depth: m.depth, col: m.col });
  busy = false; await place(m.col);
}
$('#undoBtn').onclick = () => {
  if (S.mode !== '2p' || !S.moves.length || busy) return;
  if (S.result) { S.result = null; S.end = 0; }
  S.moves.pop(); S.turn = -S.turn; save(); renderPlay();
};
$('#newBtn').onclick = () => { aiToken++; busy = false; pickStep = 1; renderSetup(); showView('setup'); };
$('#againBtn').onclick = () => startGame(true);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
  if (e.key === 'Escape' && $('#modal').classList.contains('show')) return closeModal();
  if (/^[1-7]$/.test(e.key) && $('#play').classList.contains('on') && !$('#modal').classList.contains('show')) humanMove(+e.key - 1);
});

function highlight(cs) { grid.classList.add('done'); cs.forEach(i => { const c = Math.floor(i / H), r = i % H, d = cells[c][r].querySelector('.disc'); if (d) d.classList.add('win'); }); }
function finish(winnerColor, cs) {
  const winner = winnerColor;                             // board colours are player ids: 1 = player 1 (you), -1 = player 2 / computer
  S.result = { winner, cells: cs }; S.end = Date.now();
  if (cs) highlight(cs);
  if (!S.counted) { const st = stats();
    if (S.mode === 'cpu') st[S.diff][winner === 1 ? 0 : winner === -1 ? 1 : 2]++; else st.twoP++;
    ls.set(K_STATS, st); S.counted = true; }
  save();
  setTimeout(() => { showResult(); if (S.mode === 'cpu' && winner === 1) postScore(); }, cs ? (FAST ? 300 : 1300) : 600);
  if (window.ANONNews) window.ANONNews.gameOver({ delay: 3800 });   // newsletter pop-up after the result
}
const myMoves = () => S.moves.filter((_, i) => (i % 2 === 0) === (S.starter === 1)).length;
const secs = () => Math.min(86400, Math.max(4, myMoves(), Math.round(((S.end || Date.now()) - (S.start || Date.now())) / 1000)));

/* ---------- leaderboard ---------- */
async function postScore() {
  if (!S.result || S.result.winner !== 1 || S.mode !== 'cpu' || (S.lb && S.lb.done)) return;
  const m = myMoves(), t = secs(), sc = score(S.diff, m);
  S.lb = { done: false, msg: 'Posting your score…', score: sc }; save(); paintLb();
  let r;
  try { r = window.ANONLB ? await window.ANONLB.submit({ game: GAME, score: sc, time: t, moves: m, mode: S.diff }) : { status: 'local', message: 'Leaderboard unavailable.' }; }
  catch (e) { r = { status: 'error', message: 'Could not reach the leaderboard.' }; }
  const retry = r.status === 'error' || r.status === 'skipped' || (r.status === 'local' && window.ANONLB && window.ANONLB.isConfigured() && !window.ANONLB.getNickname());
  S.lb = { done: !retry, ok: r.status === 'online', msg: r.message || '', score: sc, retry }; save(); paintLb();
}
function paintLb() {
  const box = document.getElementById('lbMsg'); if (!box) return;
  box.innerHTML = ''; box.className = 'lbmsg' + (S.lb && S.lb.ok ? ' ok' : '');
  if (S.mode !== 'cpu') { box.textContent = '2-player games are just for fun (no leaderboard).'; return; }
  if (S.result.winner !== 1) { box.textContent = 'Beat the computer to get on the leaderboard.'; return; }
  const sc = S.lb ? S.lb.score : score(S.diff, myMoves());
  box.appendChild(document.createTextNode('Score ' + sc + '. ' + (S.lb ? S.lb.msg : '')));
  if (S.lb && S.lb.retry) { const b = el('button', '', 'Post score'); b.onclick = () => { S.lb = null; postScore(); }; box.appendChild(b); }
}
const openLB = () => { if (window.ANONLB) window.ANONLB.openBoard(GAME, { title: TITLE, periods: ['day', 'all'], movesLabel: 'moves', modeLabels: DIFF_NAME }); else toast('Leaderboard unavailable'); };
$('#lbBtn').onclick = openLB;

/* ---------- modals ---------- */
function openModal(build) { const p = $('#panel'); p.innerHTML = ''; const x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.onclick = closeModal; p.appendChild(x); build(p); $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); $('#panel').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function showResult() {
  const w = S.result.winner, cpu = S.mode === 'cpu';
  openModal(p => {
    if (w !== 0) { const d = el('div', 'disc res-disc' + (w === -1 ? ' p2' : '')); setDisc(d, charById(w === 1 ? S.p1 : S.p2)); p.appendChild(d); }
    p.appendChild(el('h2', '', w === 0 ? 'Draw!' : cpu ? (w === 1 ? 'ANON wins! 👑' : 'Computer wins') : (w === 1 ? 'Player 1 wins!' : 'Player 2 wins!')));
    p.appendChild(el('div', 'res-sub', w === 0 ? 'Nobody got four in a row. Rematch?' : charById(w === 1 ? S.p1 : S.p2).name + (cpu ? ' · ' + DIFF_NAME[S.diff] : '')));
    const g = el('div', 'stats'), t = secs();
    [[cpu ? myMoves() : S.moves.length, cpu ? 'Your moves' : 'Moves'], [Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'), 'Time'], [cpu && w === 1 ? score(S.diff, myMoves()) : '–', 'Score']]
      .forEach(([v, l]) => { const s = el('div', 'stat'); s.appendChild(el('b', '', String(v))); s.appendChild(el('span', '', l)); g.appendChild(s); });
    p.appendChild(g);
    if (cpu) { const st = stats()[S.diff]; p.appendChild(el('div', 'rec', 'Your record on ' + DIFF_NAME[S.diff] + ': ' + st[0] + ' won · ' + st[1] + ' lost · ' + st[2] + ' drawn')); }
    const row = el('div', 'row');
    const lb = el('button', 'btn', '🏆 Board'); lb.type = 'button'; lb.onclick = openLB; if (cpu) row.appendChild(lb);
    const nw = el('button', 'btn', 'New'); nw.type = 'button'; nw.onclick = () => { closeModal(); $('#newBtn').click(); }; row.appendChild(nw);
    const ag = el('button', 'btn pri', 'Play again'); ag.type = 'button'; ag.id = 'rAgain'; ag.onclick = () => startGame(true); row.appendChild(ag);
    p.appendChild(row);
    const m = el('div', 'lbmsg'); m.id = 'lbMsg'; p.appendChild(m);
  });
  paintLb();
}
function showHelp() {
  openModal(p => {
    p.appendChild(el('h2', '', 'How to play'));
    p.appendChild(el('p', '', 'Pick your ANON character, then take turns dropping counters into the board. Tap a column to drop. Get four of your counters in a row (across, up and down, or diagonally) to win.'));
    p.appendChild(el('p', '', 'Play the computer on Easy, Medium or Hard, or pass the phone to a friend for 2 players.'));
    p.appendChild(el('p', '', 'Leaderboard: only wins against the computer count. Hard wins score most, and winning in fewer moves scores more. Score = 100 (Easy), 300 (Medium) or 600 (Hard) + 10 for every move you didn\'t need (22 − your moves).'));
    const r = el('div', 'row'), b = el('button', 'btn pri', "Let's play"); b.type = 'button'; b.onclick = closeModal; r.appendChild(b); p.appendChild(r);
  });
  ls.set(K_SEEN, 1);
}
$('#helpBtn').onclick = showHelp;
/* keep the long title on one line on narrow phones: shrink it until it fits */
function fitTitle() { const h = document.querySelector('h1'); h.style.fontSize = ''; let f = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth && f > 11) { f -= 0.5; h.style.fontSize = f + 'px'; } }
fitTitle(); addEventListener('resize', fitTitle); if (document.fonts) document.fonts.ready.then(fitTitle); setTimeout(fitTitle, 600);

/* ---------- boot ---------- */
renderSetup();
const saved = ls.get(K_GAME, null);
if (saved && saved.moves && Array.isArray(saved.moves) && !saved.result && saved.moves.length && CHARS.some(c => c.id === saved.p1)) {
  S = Object.assign(newState(), saved); renderPlay(); showView('play'); if (isCpuTurn()) aiTurn();
} else showView('setup');
if (!ls.get(K_SEEN, 0)) setTimeout(showHelp, 300);
window.ANON_C4 = { version: '1.1.0', engine: E, chars: CHARS, score, state: () => JSON.parse(JSON.stringify(S)), busy: () => busy || isCpuTurn(), aiLog: () => lastAi.slice(),
  usingWorker: () => !!worker, setup: () => Object.assign({}, setup), tap: c => humanMove(c) };
})();
</script>
</body>
</html>

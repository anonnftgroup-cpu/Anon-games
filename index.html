button{font:inherit;cursor:pointer}
header{padding:calc(6px + env(safe-area-inset-top)) 10px 4px;max-width:980px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px rgba(212,175,55,.6),0 0 12px rgba(43,255,136,.25);flex:none}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(18px,5.4vw,28px);letter-spacing:.14em;white-space:nowrap;
  background:linear-gradient(180deg,#fff3c4 0%,#e9c858 45%,#b48a25 75%,#f5dc85 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(43,255,136,.22))}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(212,175,55,.6);background:rgba(0,0,0,.45);color:var(--gold2);font-weight:800;font-size:17px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.stat{border:1px solid rgba(212,175,55,.32);border-radius:9px;padding:3px 4px;text-align:center;background:rgba(0,0,0,.45);box-shadow:inset 0 0 10px rgba(43,255,136,.05)}
.stat b{display:block;font-size:15px;line-height:1.25;color:var(--gold2);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:9px;letter-spacing:.14em;color:#9d9580;text-transform:uppercase}
#table{position:relative;flex:1;min-height:0;width:100%;max-width:980px;margin:0 auto;touch-action:none}
.slot{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.1);border:1.5px dashed rgba(212,175,55,.38);
  background:rgba(0,0,0,.28);box-shadow:inset 0 0 14px rgba(43,255,136,.07);display:flex;align-items:center;justify-content:center;
  color:rgba(212,175,55,.35);font-family:Georgia,serif;font-weight:700;font-size:calc(var(--cw)*.42)}
.slot[data-pile=stock]{cursor:pointer;font-size:calc(var(--cw)*.5)}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);perspective:600px;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.7,.3,1);will-change:transform}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .28s ease}
.card:not(.up) .inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;border-radius:calc(var(--cw)*.1);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.face{background:linear-gradient(160deg,#fffdf6 0%,#f6efdc 70%,#ece2c6 100%);border:1px solid #b8962e;box-shadow:0 1px 3px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,248,224,.9)}

.tl{position:absolute;left:7%;top:3%;display:flex;align-items:baseline;line-height:1;font-weight:800}
.tl .r{font-size:calc(var(--cw)*.38);letter-spacing:-.07em;font-family:"Arial Narrow",Arial,Helvetica,sans-serif}
.tl .s{font-size:calc(var(--cw)*.30);margin-left:calc(var(--cw)*.04)}
.mid{position:absolute;left:0;right:0;bottom:7%;text-align:center;line-height:1;font-size:calc(var(--cw)*.62)}
.mid.ace{font-size:calc(var(--cw)*.74);bottom:9%}
.mid.court{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:calc(var(--cw)*.5);bottom:9%;text-shadow:0 0 1px #d4af37}
.mid.court i{display:block;font-style:normal;font-size:calc(var(--cw)*.24);color:#b8902a;margin-bottom:1px}
.face.court::after{content:"";position:absolute;left:14%;right:14%;top:40%;bottom:6%;border:1px solid rgba(184,150,46,.65);border-radius:calc(var(--cw)*.06);background:rgba(212,175,55,.07)}
.red{color:#c4122f}.blk{color:#14161b}
.card.drag{transition:none;cursor:grabbing}
.card.drag .face,.card.drag .back{box-shadow:0 8px 18px rgba(0,0,0,.6),0 0 10px rgba(43,255,136,.25)}
.card.shake .inner{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.noanim .card,.noanim .card .inner{transition:none!important}
.toolbar{display:flex;gap:7px;padding:6px 10px 4px;max-width:980px;width:100%;margin:0 auto}
.btn{flex:1;min-height:44px;border-radius:11px;border:1px solid rgba(212,175,55,.75);background:linear-gradient(180deg,#1d1a0d,#0a0905);color:var(--gold2);
  font-weight:700;letter-spacing:.06em;font-size:14px;box-shadow:0 0 12px rgba(43,255,136,.08),inset 0 1px 0 rgba(255,240,180,.15)}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn:disabled{opacity:.4}
footer{text-align:center;font-size:11px;color:#8c8570;padding:2px 8px calc(6px + env(safe-area-inset-bottom));letter-spacing:.04em}
footer a{color:#b9a35c;text-decoration:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--gold);color:var(--gold2);padding:7px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:1500}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
#modal{background:rgba(0,0,0,.6)}
.panel{position:relative;width:100%;max-width:350px;background:rgba(6,8,11,.94);border:1px solid var(--gold);border-radius:16px;padding:18px 18px 16px;text-align:center;
  box-shadow:0 0 0 4px rgba(212,175,55,.08),0 0 40px rgba(43,255,136,.18);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:0 0 8px;font-family:Georgia,serif;color:var(--gold2);letter-spacing:.08em;font-size:20px}
.panel p{margin:6px 0;font-size:14px;line-height:1.45;color:#d9d2bc;text-align:left}
.panel .row{display:flex;gap:8px;margin-top:14px}
#win canvas{position:absolute;inset:0;width:100%;height:100%}
#win .panel{display:none}
#win.msg .panel{display:block}
#win.msg{background:rgba(0,0,0,.35)}
.winart{width:44%;max-width:150px;border-radius:12px;border:1px solid var(--gold);box-shadow:0 0 18px rgba(43,255,136,.3)}
.anon{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:58px;letter-spacing:.2em;margin:6px 0 0 .2em;line-height:1.05;
  background:linear-gradient(180deg,#fff3c4,#e9c858 45%,#a47c1f 75%,#f5dc85);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(43,255,136,.35))}
.winsub{color:var(--gold2);font-size:15px;letter-spacing:.06em;margin:2px 0 10px}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.newbest{display:none;margin-top:8px;color:var(--green);font-weight:700;letter-spacing:.1em;font-size:13px}
.newbest.show{display:block}

const $ = s => document.querySelector(s);
const table = $('#table');
let G = null, undoStack = [], L = {}, drag = null, autoRunning = false, modalOpen = false;

const slots = {};

/* ---------- Build DOM ---------- */

  const court = r > 10;

/* ---------- State ---------- */

const pileArr = p => p.t === 'stock' ? G.stock : p.t === 'waste' ? G.waste : p.t === 'found' ? G.found[p.i] : G.tab[p.i];

/* ---------- Layout ---------- */
const colX = c => L.x0 + c * (L.cw + L.gap);

  const n = G.waste.length, fanStart = G.draw3 ? Math.max(0, n - 3) : n;

/* ---------- HUD ---------- */
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const modeKey = () => G.draw3 ? 'd3' : 'd1';

function hud() {
  $('#sScore').textContent = G.score;
  $('#sMoves').textContent = G.moves;
  $('#sTime').textContent = fmt(G.time);
  const st = getStats()[modeKey()];
  $('#sBest').textContent = st.best ? st.best : '–';

}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

/* ---------- Timer & save ---------- */
setInterval(() => {
  if (G && G.started && !G.done && !document.hidden && !modalOpen) { G.time++; $('#sTime').textContent = fmt(G.time); if (G.time % 5 === 0) save(); }
}, 1000);

/* ---------- Rules ---------- */

    const f = G.found[dst.i], top = f[f.length - 1];
    return top ? suitOf(top.id) === suitOf(lead.id) && rankOf(lead.id) === rankOf(top.id) + 1 : rankOf(lead.id) === 1;

}
function movable(loc) {

}

}

}

  const s = loc.p.t, d = dst.t;
  if (d === 'found') G.score += 10;
  else if (s === 'waste' && d === 'tab') G.score += 5;

}
function flipTop(loc) {

}

}
function drawStock() {
  if (G.done || autoRunning) return;

function bestTarget(loc) {

function shake(cards) {

/* ---------- Auto-complete ---------- */
function maybeAuto() {

  if (!G.tab.every(p => p.every(c => c.up))) return;
  autoRunning = true; toast('Auto-completing…'); hud();
  const step = () => {
    if (G.done) { autoRunning = false; return; }
    let best = null;
    for (let t = 0; t < 7; t++) {
      const p = G.tab[t]; if (!p.length) continue;
      const loc = { p: { t: 'tab', i: t }, idx: p.length - 1 };
      for (let f = 0; f < 4; f++) if (legal(loc, { t: 'found', i: f })) { if (!best || rankOf(p[p.length - 1].id) < rankOf(best.c)) best = { loc, f, c: p[p.length - 1].id }; break; }
    }
    if (!best) { autoRunning = false; hud(); return; }
    G.found[best.f].push(G.tab[best.loc.p.i].pop());
    G.score += 10; G.moves++;

/* ---------- Input (pointer events: touch + mouse) ---------- */
const rectOverlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
table.addEventListener('pointerdown', e => {

  drag = null;

    const loc = locate(+cardEl.dataset.id);
    if (!loc) return;
    if (loc.p.t === 'stock') { drag = { stock: true, x: e.clientX, y: e.clientY }; return; }
    if (!movable(loc)) return;
    const cards = pileArr(loc.p).slice(loc.idx), pos = computePositions();

  drag.started = true; drag.dx = dx; drag.dy = dy;
  drag.cards.forEach((c, i) => {
    const el = els[c.id], o = drag.orig[i];
    el.classList.add('drag'); el.style.zIndex = 1000 + i;

  });
});
function findDrop(d) {

  let best = null, bestA = 0;
  const consider = (dst, r) => { const a = rectOverlap(lead, r); if (a > bestA && legal(d.loc, dst)) { best = dst; bestA = a; } };
  if (d.cards.length === 1) for (let i = 0; i < 4; i++) consider({ t: 'found', i }, { x: colX(3 + i), y: L.y0, w: L.cw, h: L.ch });

    const p = G.tab[j], last = p.length ? pos.get(p[p.length - 1].id).y : L.ty;

table.addEventListener('pointerup', e => {
  const d = drag; drag = null;

/* ---------- Modal ---------- */
function showModal(title, html, buttons) {
  const p = $('#modalPanel');
  p.innerHTML = `<h2>${title}</h2>${html}<div class="row"></div>`;
  const row = p.querySelector('.row');
  buttons.forEach(b => { const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = b.label; btn.onclick = () => { closeModal(); b.action && b.action(); }; row.appendChild(btn); });
  $('#modal').classList.add('show'); modalOpen = true;
}
function closeModal() { $('#modal').classList.remove('show'); modalOpen = false; }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
function confirmNew(msg, fn) {
  if (G.started && !G.done) showModal('New game?', `<p>${msg}</p>`, [{ label: 'Cancel' }, { label: 'Yes', action: fn }]);
  else fn();
}

/* ---------- New game / deal ---------- */
function newGame(draw3 = G ? G.draw3 : store.get(KEY_DRAW, false)) {
  closeWin();
  G = newState(draw3); undoStack = []; autoRunning = false;
  els.forEach(el => { el.style.visibility = ''; el.style.transitionDelay = ''; });
  // start every card on the stock, then deal out
  table.classList.add('noanim');
  els.forEach(el => { el.classList.remove('up'); el.style.transform = `translate3d(${colX(0)}px,${L.y0}px,0)`; });
  void table.offsetWidth; table.classList.remove('noanim');
  let order = 0; const delay = {};
  for (let row = 0; row < 7; row++) for (let j = row; j < 7; j++) delay[G.tab[j][row].id] = order++;
  Object.keys(delay).forEach(id => { els[id].style.transitionDelay = (delay[id] * 22) + 'ms'; });
  render();
  setTimeout(() => els.forEach(el => { el.style.transitionDelay = ''; }), 1000);
  save();
}

/* ---------- Win ---------- */
function win() {
  if (G.done) return;
  G.done = true;
  const bonus = G.time >= 30 ? Math.round(700000 / G.time) : 0; // classic Windows time bonus
  G.score += bonus;
  const st = getStats(), m = st[modeKey()];
  const newBest = G.score > m.best;
  m.wins++; if (newBest) m.best = G.score;
  if (m.bestTime == null || G.time < m.bestTime) m.bestTime = G.time;
  store.set(KEY_STATS, st); store.del(KEY_GAME);
  hud();
  Leaderboard.submitScore(G.score, G.time, G.moves, { game: 'solitaire', mode: G.draw3 ? 'draw3' : 'draw1', bonus });
  $('#wScore').textContent = G.score; $('#wTime').textContent = fmt(G.time); $('#wMoves').textContent = G.moves;
  $('#wBest').classList.toggle('show', newBest);
  celebrate();
}
let fxRaf = 0, fxTimers = [];
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  const c = document.createElement('canvas'); c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#fffdf6'); g.addColorStop(1, '#efe4c6');
  rr(x, .5, .5, w - 1, h - 1, w * .1); x.fillStyle = g; x.fill(); x.lineWidth = 1.5; x.strokeStyle = '#d4af37'; x.stroke();
  x.fillStyle = isRed(id) ? '#c4122f' : '#14161b'; x.textBaseline = 'top';
  x.font = `800 ${Math.round(w * .38)}px Arial, sans-serif`; x.fillText(RANKS[rankOf(id)], w * .07, h * .04);
  x.font = `${Math.round(w * .62)}px serif`; x.textAlign = 'center'; x.textBaseline = 'bottom';

function celebrate() {
  const ov = $('#win'), cv = $('#fx');
  ov.classList.add('show'); ov.classList.remove('msg');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const showMsg = () => ov.classList.add('msg');
  if (reduce) { showMsg(); return; }

  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const tr = table.getBoundingClientRect(), cw = L.cw, ch = L.ch;

  for (let r = 13; r >= 1; r--) for (let f = 0; f < 4; f++) { const c = G.found[f].find(c => rankOf(c.id) === r); if (c) queue.push({ id: c.id, f }); }
  const live = []; let launched = 0, frame = 0;
  const launch = () => {
    if (launched >= queue.length) return;
    const q = queue[launched++];
    els[q.id].style.visibility = 'hidden';
    live.push({ img: cardCanvas(q.id, cw, ch, dpr), x: tr.left + colX(3 + q.f), y: tr.top + L.y0,
      vx: (Math.random() < .5 ? -1 : 1) * (1.5 + Math.random() * 4) * (W / 400 + .5), vy: -(Math.random() * 6) - 1 });
  };

    frame++;

}

/* ---------- Buttons & keys ---------- */
$('#newBtn').onclick = () => confirmNew('Start a new deal? This game will be lost.', () => newGame());
$('#undoBtn').onclick = undo;
$('#drawBtn').onclick = () => {
  const next = !G.draw3;
  confirmNew(`Switch to Draw ${next ? 3 : 1}? This starts a new deal.`, () => { store.set(KEY_DRAW, next); newGame(next); toast(`Draw ${next ? 3 : 1} mode`); });
};
$('#againBtn').onclick = () => newGame();
$('#helpBtn').onclick = () => {
  const s = getStats(), f = k => `${s[k].wins} wins · best ${s[k].best || '–'} · fastest ${s[k].bestTime != null ? fmt(s[k].bestTime) : '–'}`;
  showModal('How to play', `<p>Build each foundation (top right) from <b>A</b> up to <b>K</b> in one suit.</p>
  <p>On the table, stack cards down in alternating colours. Only a <b>K</b> can go in an empty space.</p>
  <p><b>Tap</b> a card to send it to the best spot, or <b>drag</b> it. Tap the deck to draw.</p>
  <p style="font-size:12px;color:#9d9580">Draw 1: ${f('d1')}<br>Draw 3: ${f('d3')}</p>`, [{ label: 'Got it' }]);
};
document.addEventListener('keydown', e => {
  if (modalOpen) { if (e.key === 'Escape') closeModal(); return; }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'u') { e.preventDefault(); undo(); }
  else if (e.key === ' ') { e.preventDefault(); drawStock(); }
  else if (e.key === 'n') $('#newBtn').click();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); render(false); }, 60); });

/* ---------- Debug / integration API ---------- */
window.ANON_SOLITAIRE = {
  state: () => JSON.parse(JSON.stringify(G)),
  newGame: d => newGame(d),
  undo, drawStock,
  tap(id) { const loc = locate(id); if (loc) { if (loc.p.t === 'stock') drawStock(); else if (movable(loc)) tapCard(loc); } },
  debugWin() {
    if (G.done) return;
    const all = [...G.stock, ...G.waste, ...G.tab.flat(), ...G.found.flat()];
    G.stock = []; G.waste = []; G.tab = [[], [], [], [], [], [], []];
    G.found = [0, 1, 2, 3].map(s => all.filter(c => suitOf(c.id) === s).sort((a, b) => rankOf(a.id) - rankOf(b.id)).map(c => ({ id: c.id, up: true })));
    G.started = true; render(); win();
  },
  debugNearWin() {
    // all cards face up: foundations hold A-9, tableau holds 10-K; next move triggers auto-complete
    const ids = [...Array(52).keys()];
    G.stock = []; G.waste = []; undoStack = [];
    G.found = [0, 1, 2, 3].map(s => ids.filter(id => suitOf(id) === s && rankOf(id) <= 9).map(id => ({ id, up: true })));
    G.tab = [[], [], [], [], [], [], []];
    const order = [];
    for (let r = 13; r >= 10; r--) for (let s = 0; s < 4; s++) order.push(s * 13 + r - 1);
    order.forEach((id, k) => G.tab[k % 4].push({ id, up: true }));
    G.started = true; render(); save();
  }
};

/* ---------- Boot ---------- */
layout();
const saved = store.get(KEY_GAME, null);
if (saved && !saved.done && Array.isArray(saved.tab) && saved.tab.length === 7 &&
    (saved.stock.length + saved.waste.length + saved.found.flat().length + saved.tab.flat().length) === 52) {
  G = saved; render(false);
} else newGame(store.get(KEY_DRAW, false));
})();
</script>
</body>
</html>

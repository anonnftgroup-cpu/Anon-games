<style>
:root{--gold:#d4af37;--gold2:#f3d77a;--gold3:#8a6d1f;--green:#2bff88;--ink:#05070a;--txt:#e9e3cf;--mut:#9d9580}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(ellipse 90% 45% at 50% 0%,rgba(43,255,136,.13),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 100%,rgba(212,175,55,.08),transparent 70%),var(--ink)}
button,input{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:4px 2px 10px}
.logo{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(212,175,55,.7),0 0 18px rgba(43,255,136,.3);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(212,175,55,.9),0 0 26px rgba(43,255,136,.45)}}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(24px,7.4vw,34px);letter-spacing:.14em;line-height:1.05;
  background:linear-gradient(180deg,#fff3c4 0%,#e9c858 45%,#b48a25 75%,#f5dc85 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(43,255,136,.25))}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px;letter-spacing:.03em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border:1px solid rgba(212,175,55,.35);border-radius:14px;background:rgba(0,0,0,.4);position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tab{min-height:42px;border:0;border-radius:10px;background:transparent;color:#b9a35c;font-weight:800;letter-spacing:.06em;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#e9c858,#a47c1f);color:#120e02;box-shadow:0 0 14px rgba(43,255,136,.18)}
.tools{margin:12px 0 4px;display:none}
.tools.show{display:block}
.search{position:relative}
.search input{width:100%;min-height:44px;padding:10px 38px 10px 38px;border-radius:12px;border:1px solid rgba(212,175,55,.55);background:#0b0d10;color:var(--gold2);font-size:16px;outline:none}
.search input:focus{box-shadow:0 0 0 3px rgba(43,255,136,.22)}
.search::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-52%) scaleX(-1);color:#8a7a45;font-size:19px}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#b9a35c;font-size:16px;display:none;cursor:pointer}
.clear.show{display:block}
.chips{position:relative;display:flex;gap:7px;overflow-x:auto;padding:10px 1px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(212,175,55,.45);background:rgba(0,0,0,.35);color:#b9a35c;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(212,175,55,.18);color:var(--gold2);border-color:var(--gold);box-shadow:0 0 10px rgba(43,255,136,.15)}
.chip .n{opacity:.6;font-weight:600;margin-left:5px}
.sorts{padding-top:8px;padding-bottom:0}
.sorts .chip{min-height:30px;font-size:12.5px;padding:0 12px}
.badge.hot{background:linear-gradient(180deg,#e9c858,#a47c1f);color:#120e02;border-color:#f3d77a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;color:inherit;
  border:1px solid rgba(212,175,55,.55);background:linear-gradient(180deg,#0f1114,#07080a);box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 rgba(43,255,136,0);transition:transform .15s,box-shadow .2s}
.tile:active{transform:scale(.97)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.55),0 0 18px rgba(43,255,136,.22)}}
.tile:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.thumb{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#0a0d10}
.meta{padding:8px 10px 10px}
.name{font-family:Georgia,serif;font-weight:700;font-size:15px;color:var(--gold2);letter-spacing:.02em;line-height:1.2}
.tag{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between;pointer-events:none}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:9px;background:rgba(0,0,0,.72);border:1px solid rgba(212,175,55,.6);color:var(--gold2);text-transform:uppercase}
.badge.new{background:var(--green);color:#03140a;border-color:var(--green)}
.badge.lb{margin-left:auto}
.tile.soon{cursor:default;border-style:dashed;border-color:rgba(212,175,55,.35)}
.tile.soon .thumb{filter:grayscale(.7) brightness(.6)}
.tile.soon .name{color:#b9a35c}
.tile.soon .badge.soonb{background:rgba(0,0,0,.8);color:#d4af37;border-style:dashed}
.play{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--green)}
.tile.soon .play{color:#7a7158}
.empty{text-align:center;color:var(--mut);padding:30px 10px;display:none}
.empty.show{display:block}
.view{display:none}.view.on{display:block}
.lbhead{margin:12px 0 2px;scroll-snap-type:x proximity;scroll-padding:0 12px;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.lbhead .chip{scroll-snap-align:start;min-height:38px;touch-action:manipulation}
.lbhead .chip.on{background:linear-gradient(180deg,#e9c858,#a47c1f);color:#120e02;border-color:#f3d77a}
.lbhead::after{content:'';flex:none;width:24px}
.lbbox{margin-top:8px;border:1px solid rgba(212,175,55,.35);border-radius:14px;background:rgba(0,0,0,.35);padding:10px 8px;min-height:300px}
.lbbox .alb-list{max-height:none}
.lbplay{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px;border:1px solid rgba(212,175,55,.55);border-radius:14px;background:linear-gradient(180deg,#0f1114,#07080a);box-shadow:0 0 14px rgba(43,255,136,.12)}
.lbplay img{width:64px;height:48px;flex:none;border-radius:9px;object-fit:cover;background:#0a0d10;border:1px solid rgba(212,175,55,.35)}
.lbplay-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 12px;border-radius:12px;border:1px solid #f3d77a;
  background:linear-gradient(180deg,#e9c858,#a47c1f);color:#120e02;font-weight:900;font-size:15px;letter-spacing:.03em;text-decoration:none;text-align:center;line-height:1.15;box-shadow:0 0 16px rgba(43,255,136,.22);transition:transform .12s}
.lbplay-btn:active{transform:scale(.97)}
.lbplay-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.lbplay-btn .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
footer{text-align:center;font-size:11.5px;color:#8c8570;padding:18px 8px 6px;letter-spacing:.05em}
footer a{color:#b9a35c;text-decoration:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.88);border:1px solid var(--gold);color:var(--gold2);padding:8px 15px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6000;white-space:nowrap}
#toast.show{opacity:1}
.err{text-align:center;color:var(--mut);padding:30px 10px}
.err button{margin-top:10px;min-height:40px;padding:0 18px;border-radius:11px;border:1px solid var(--gold);background:#111;color:var(--gold2);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.logo{animation:none}.tile{transition:none}}
</style>

<body>
<div class="wrap">
  <header>
    <img class="logo" src="assets/logo.webp" alt="ANON NFTs logo" width="58" height="58">
    <div><h1>ANON ARCADE</h1><div class="sub">Free ANON games · no wallet, no sign-up</div></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" id="tabGames" role="tab" aria-selected="true" data-tab="games">🎮 Games</button>
    <button class="tab" id="tabLb" role="tab" aria-selected="false" data-tab="leaderboards">🏆 Leaderboards</button>
  </nav>

  <section class="view on" id="viewGames" aria-label="Games">
    <div class="tools" id="tools">
      <label class="search"><span class="sr">Search games</span>
        <input id="q" type="search" placeholder="Search games…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="qClear" type="button" aria-label="Clear search">✕</button>
      </label>
      <div class="chips sorts" id="sorts" role="toolbar" aria-label="Sort games"></div>
      <div class="chips" id="cats" role="toolbar" aria-label="Categories"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">No games match. Try another word, ninja.</div>
  </section>

  <section class="view" id="viewLb" aria-label="Leaderboards">
    <div class="chips lbhead" id="lbGames" role="toolbar" aria-label="Choose a leaderboard"></div>
    <div class="lbplay" id="lbPlay" hidden></div>
    <div class="lbbox" id="lbBox"></div>
  </section>

  <footer>ANON NFTs · <a href="https://anonnfts.com" target="_blank" rel="noopener">anonnfts.com</a> · <a href="https://anonnfts.com/privacy-notice" target="_blank" rel="noopener">Privacy</a> · Art CC0</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="shared/leaderboard.js?v=1.7.0"></script>
<script>
(() => {
'use strict';
/* ANON Arcade hub. Everything is driven by games.json: add a folder + one entry. */
const SHOW_TOOLS_AFTER = 6;              // search + category chips appear when there are more games than this
const NEW_DAYS = 7, NEW_MAX = 10;        // "New" badge: added (git date) in the last 7 days, newest 10 at most
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
let GAMES = [], cat = 'All', query = '', lbGame = null, sort = 'popular', TOP = new Set();
const SORTS = [['popular', '🔥 Most played'], ['new', '✨ Newest'], ['az', 'A–Z']];

const toast = (m => { let t; return msg => { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(t); t = setTimeout(() => e.classList.remove('show'), 1800); }; })();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const isLive = g => g.status !== 'soon' && g.status !== 'hidden' && !!g.path;
const gameUrl = g => g.path + (g.path.includes('?') ? '&' : '?') + 'hub=1';
let NEWSET = new Set();
const addedAt = g => Date.parse(g.added) || 0;
const isNew = g => NEWSET.has(g.id);
function computeNew() {
  NEWSET = new Set(GAMES.filter(g => isLive(g) && addedAt(g) && Date.now() - addedAt(g) < NEW_DAYS * 864e5)
    .sort((a, b) => addedAt(b) - addedAt(a)).slice(0, NEW_MAX).map(g => g.id));
}

function open(g) {
  if (!isLive(g)) { toast('🥷 ' + g.name + ' is coming soon'); return; }
  location.href = gameUrl(g);
}

function tile(g) {
  const b = el('button', 'tile' + (isLive(g) ? '' : ' soon')); b.type = 'button'; b.dataset.id = g.id;
  b.setAttribute('aria-label', g.name + (isLive(g) ? '. Play' : '. Coming soon'));
  const img = el('img', 'thumb'); img.loading = 'lazy'; img.decoding = 'async'; img.alt = ''; img.width = 480; img.height = 360;
  img.src = g.thumb || 'assets/coming-soon.webp'; img.onerror = () => { img.onerror = null; img.src = 'assets/coming-soon.webp'; };
  b.appendChild(img);
  const badges = el('div', 'badges');
  if (!isLive(g)) badges.appendChild(el('span', 'badge soonb', 'Coming soon'));
  else if (TOP.has(g.id) && sort === 'popular') badges.appendChild(el('span', 'badge hot', '🔥 Hot'));
  else if (isNew(g)) badges.appendChild(el('span', 'badge new', 'New'));
  if (isLive(g) && g.leaderboard) badges.appendChild(el('span', 'badge lb', '🏆'));
  b.appendChild(badges);
  const m = el('div', 'meta'); m.appendChild(el('div', 'name', g.name)); m.appendChild(el('div', 'tag', g.tagline || ''));
  m.appendChild(el('span', 'play', isLive(g) ? '▶ PLAY' : 'SOON'));
  b.appendChild(m);
  b.onclick = () => open(g);
  return b;
}

function visible() {
  const q = query.trim().toLowerCase();
  // GAMES is already in popularity order; other sorts are stable re-sorts of it.
  const base = sort === 'az' ? GAMES.slice().sort((a, b) => a.name.replace(/^ANON\s+/i, '').localeCompare(b.name.replace(/^ANON\s+/i, '')))
    : sort === 'new' ? GAMES.slice().sort((a, b) => addedAt(b) - addedAt(a)) : GAMES;
  return base.filter(g => (cat === 'All' || g.category === cat) &&
    (!q || [g.name, g.tagline, g.category, ...(g.tags || [])].join(' ').toLowerCase().includes(q)));
}

function renderGrid() {
  const grid = $('#grid'); grid.innerHTML = '';
  const list = visible();
  list.forEach(g => grid.appendChild(tile(g)));
  $('#empty').classList.toggle('show', !list.length);
}

function renderTools() {
  const show = GAMES.length > SHOW_TOOLS_AFTER;
  $('#tools').classList.toggle('show', show);
  if (!show) { cat = 'All'; query = ''; return; }
  const cats = ['All', ...[...new Set(GAMES.map(g => g.category).filter(Boolean))].sort()];
  const sb = $('#sorts'); sb.innerHTML = '';
  SORTS.forEach(([k, label]) => {
    const b = el('button', 'chip' + (k === sort ? ' on' : ''), label); b.type = 'button'; b.dataset.sort = k;
    b.setAttribute('aria-pressed', String(k === sort));
    b.onclick = () => { sort = k; renderTools(); renderGrid(); };
    sb.appendChild(b);
  });
  const box = $('#cats'); box.innerHTML = '';
  cats.forEach(c => {
    const n = c === 'All' ? GAMES.length : GAMES.filter(g => g.category === c).length;
    const b = el('button', 'chip' + (c === cat ? ' on' : ''), c); b.type = 'button'; b.dataset.cat = c;
    b.appendChild(el('span', 'n', String(n)));
    b.onclick = () => { cat = c; renderTools(); renderGrid(); };
    box.appendChild(b);
  });
}

function renderLb() {
  // One scrollable row of game chips, in the hub's popularity order (GAMES is already sorted by popularity.json)
  const lbs = GAMES.filter(g => isLive(g) && g.leaderboard);
  const chips = $('#lbGames'), keepX = chips.scrollLeft;
  if (!lbs.length) { chips.innerHTML = ''; $('#lbBox').textContent = 'No leaderboards yet.'; return; }
  if (!lbGame || !lbs.find(g => g.id === lbGame)) lbGame = lbs[0].id;
  const key = lbs.map(g => g.id).join(',');
  if (chips.dataset.key !== key) {
    chips.innerHTML = ''; chips.dataset.key = key;
    lbs.forEach(g => {
      const b = el('button', 'chip', g.name); b.type = 'button'; b.dataset.game = g.id;
      b.onclick = () => { if (lbGame === g.id) return; lbGame = g.id; renderLb(); };
      chips.appendChild(b);
    });
  }
  chips.querySelectorAll('.chip').forEach(b => { const on = b.dataset.game === lbGame; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  chips.scrollLeft = keepX;
  // keep the selected chip in view without scrolling the parent page (works inside the anonnfts.com iframe)
  const on = chips.querySelector('.chip.on');
  if (on && chips.clientWidth && (on.offsetLeft < chips.scrollLeft || on.offsetLeft + on.offsetWidth > chips.scrollLeft + chips.clientWidth - 24))
    chips.scrollLeft = Math.max(0, on.offsetLeft - 40);
  const g = lbs.find(x => x.id === lbGame);
  renderLbPlay(g);
  const box = $('#lbBox');
  if (box.dataset.game === g.id && box.dataset.drawn) return;
  box.dataset.game = g.id; box.dataset.drawn = '1';
  if (window.ANONLB) window.ANONLB.renderBoard(box, { game: g.id, order: g.order || 'desc', scoreLabel: g.scoreLabel || 'Score', periods: g.periods, movesLabel: g.movesLabel, hideMode: g.hideMode, modeLabels: g.modeLabels });
  else box.textContent = 'Leaderboard unavailable.';
}

// Big "▶ Play <game>" button above the board being viewed. Same-frame link (like the tiles), so it stays inside the anonnfts.com iframe.
function renderLbPlay(g) {
  const bar = $('#lbPlay'); bar.innerHTML = '';
  if (!g || !isLive(g)) { bar.hidden = true; return; }
  const img = el('img'); img.alt = ''; img.width = 64; img.height = 48; img.decoding = 'async';
  img.src = g.thumb || 'assets/coming-soon.webp'; img.onerror = () => { img.onerror = null; img.src = 'assets/coming-soon.webp'; };
  const a = el('a', 'lbplay-btn'); a.href = gameUrl(g); a.dataset.game = g.id; a.id = 'lbPlayBtn';
  a.setAttribute('aria-label', 'Play ' + g.name);
  a.appendChild(el('span', '', '▶')); a.appendChild(el('span', 't', 'Play ' + g.name));
  a.onclick = e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; e.preventDefault(); open(g); };
  bar.appendChild(img); bar.appendChild(a); bar.hidden = false;
}

function setTab(t, push) {
  const lb = t === 'leaderboards';
  $('#tabGames').classList.toggle('on', !lb); $('#tabLb').classList.toggle('on', lb);
  $('#tabGames').setAttribute('aria-selected', String(!lb)); $('#tabLb').setAttribute('aria-selected', String(lb));
  $('#viewGames').classList.toggle('on', !lb); $('#viewLb').classList.toggle('on', lb);
  if (lb) renderLb();
  if (push) { const u = new URL(location.href); if (lb) u.searchParams.set('tab', 'leaderboards'); else u.searchParams.delete('tab'); u.searchParams.delete('game'); try { history.replaceState(null, '', u); } catch (e) {} }
}
$('#tabGames').onclick = () => setTab('games', true);
$('#tabLb').onclick = () => setTab('leaderboards', true);
$('#q').addEventListener('input', e => { query = e.target.value; $('#qClear').classList.toggle('show', !!query); renderGrid(); });
$('#qClear').onclick = () => { query = ''; $('#q').value = ''; $('#qClear').classList.remove('show'); renderGrid(); $('#q').focus(); };

// popularity.json = the "Most played" order (updated daily from play counts). Optional: if it fails, games.json order is used.
// Games missing from it keep their games.json order at the end, never hidden. Coming-soon tiles always go after live games.
async function loadOrder() {
  try { const r = await fetch('popularity.json', { cache: 'no-cache' }); if (!r.ok) return []; const p = await r.json(); return Array.isArray(p.order) ? p.order : []; }
  catch (e) { return []; }
}
function applyOrder(list, order) {
  const rank = new Map(); order.forEach((id, i) => { if (!rank.has(id)) rank.set(id, i); });
  const r = (g, i) => (isLive(g) ? 0 : 1e6) + (rank.has(g.id) ? rank.get(g.id) : 1e5 + i);
  return list.map((g, i) => [r(g, i), g]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
async function load() {
  try {
    // games.json is fetched once (started in <head>, shared with challenge.js); a retry fetches again
    const gp = window.ANON_GAMES_P || (window.ANON_GAMES_P = fetch('games.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))));
    const [data, order] = await Promise.all([gp.catch(e => { window.ANON_GAMES_P = null; throw e; }), loadOrder()]);
    GAMES = applyOrder((data.games || []).filter(g => g && g.id && g.name && g.status !== 'hidden'), order);
    TOP = new Set(order.length ? GAMES.filter(isLive).slice(0, 3).map(g => g.id) : []);
    computeNew();
  } catch (e) {
    const grid = $('#grid'); grid.innerHTML = '';
    const d = el('div', 'err', 'Could not load the games list.'); const b = el('button', '', 'Try again'); b.onclick = load;
    d.appendChild(el('br')); d.appendChild(b); grid.appendChild(d); grid.style.display = 'block';
    return;
  }
  $('#grid').style.display = '';
  const want = params.get('game'), tab = params.get('tab');
  // Deep link: ?game=solitaire opens the game, ?tab=leaderboards&game=solitaire opens its board
  if (want && tab !== 'leaderboards') {
    const g = GAMES.find(x => x.id === want);
    if (g && isLive(g)) { location.replace(gameUrl(g)); return; }
    if (g) toast('🥷 ' + g.name + ' is coming soon'); else toast('Game not found');
  }
  if (want) lbGame = want;
  renderTools(); renderGrid();
  setTab(tab === 'leaderboards' ? 'leaderboards' : 'games', false);
  document.body.dataset.ready = '1';
}
window.ANON_ARCADE = { reload: load, games: () => GAMES.slice() };
load();
})();
</script>
</body>
</html>

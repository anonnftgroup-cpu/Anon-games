<script>
(() => {
'use strict';
/* ANON Word Unlimited.
   Online (Supabase has supabase-word-unlimited.sql): the server picks the word and colours each guess; this page never sees
   the answer until the round is over, and the server keeps the win streak for the leaderboard.
   Before the SQL is run, offline, or without a nickname it falls back to practice words on this device (no leaderboard). */
const GAME = 'word-unlimited', TITLE = 'ANON Word Unlimited', LINK = 'https://anonnfts.com/arcade';
const K_ROUND = 'anonWordU.v1.round', K_STATS = 'anonWordU.v1.stats', K_SEEN = 'anonWordU.v1.seenHelp', K_RECENT = 'anonWordU.v1.recent', K_USED = 'anonWordU.v1.used';
const EPOCH = Date.UTC(2026, 9, 19);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const ss = { get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const FRAMED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
const IN_HUB = /[?&]hub=1\b/.test(location.search) || FRAMED;
if (IN_HUB) document.documentElement.classList.add('in-hub');
const DAILY_URL = '../word/' + (IN_HUB ? '?hub=1' : '');

/* ---------- words: valid guesses only. Practice words come from the Daily list, minus the days around today ---------- */
const D = window.ANON_WORD_DATA || { a: '', v: '' };
const DAILY = (() => { const K = [0x41, 0x4e, 0x4f, 0x4e, 0x37, 0x19]; let b; try { b = atob(D.a.split('').reverse().join('')); } catch (e) { b = ''; }
  let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b.charCodeAt(i) ^ K[i % 6] ^ (i * 7 & 255)); return s.match(/.{5}/g) || ['crown']; })();
const VALID = new Set(D.v.match(/.{5}/g) || []); DAILY.forEach(w => VALID.add(w));
function practicePool() {
  const w = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date()).forEach(p => { w[p.type] = +p.value; });
  const n = Math.round((Date.UTC(w.year, w.month - 1, w.day) - EPOCH) / 864e5) + 1, L = DAILY.length, skip = new Set();
  for (let d = n - 1; d <= n + 2; d++) skip.add(DAILY[((d - 1) % L + L) % L]);     // never hand out yesterday / today / the next two Daily words
  return DAILY.filter(x => !skip.has(x));
}
function evaluate(guess, ans) {
  const r = Array(5).fill('absent'), left = {};
  for (let i = 0; i < 5; i++) { if (guess[i] === ans[i]) r[i] = 'correct'; else left[ans[i]] = (left[ans[i]] || 0) + 1; }
  for (let i = 0; i < 5; i++) if (r[i] !== 'correct' && left[guess[i]]) { r[i] = 'present'; left[guess[i]]--; }
  return r;
}
const PAT = { c: 'correct', p: 'present', a: 'absent' };

/* ---------- server ---------- */
let SRV = 'unknown';        // on | missing (SQL not run yet) | offline | off (not configured)
async function rpc(fn, body) {
  const LB = window.ANONLB, c = LB && LB._cfg;
  const h = { apikey: c.key, 'Content-Type': 'application/json', Accept: 'application/json' }; if (/^eyJ/.test(c.key)) h.Authorization = 'Bearer ' + c.key;
  const ac = typeof AbortController !== 'undefined' ? new AbortController() : null, to = setTimeout(() => ac && ac.abort(), 7000);
  try {
    const r = await fetch(String(c.url).replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(body), mode: 'cors', credentials: 'omit', signal: ac && ac.signal });
    const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
    if (r.ok) return { ok: true, data };
    const missing = r.status === 404 || (data && (data.code === 'PGRST202' || data.code === '42883'));
    return { ok: false, missing, msg: (data && data.message) || ('HTTP ' + r.status) };
  } catch (e) { return { ok: false, net: true, msg: 'network' }; }
  finally { clearTimeout(to); }
}
async function probe() {
  const LB = window.ANONLB;
  if (!LB || !LB.isConfigured()) { SRV = 'off'; return; }
  const r = await rpc('wu_start', { p_nickname: '' });      // an empty name is always refused: tells us the SQL is there without starting a round
  SRV = r.missing ? 'missing' : r.net ? 'offline' : 'on';   // "nickname not allowed" (or ok) = the SQL is there
}
// No name yet? Play under the device's guest name (e.g. Pixel-4821) so no streak is missed; it can be changed any time.
const nick = () => { const LB = window.ANONLB; if (!LB) return ''; let n = LB.getNickname(); if (!n && LB.guestName) { const r = LB.setNickname(LB.guestName()); n = r.ok ? r.value : ''; } return n || ''; };
const online = () => SRV === 'on' && !!nick();

/* ---------- state ---------- */
let R = null, input = '', busy = false, lastStart = 0;
const blankStats = () => ({ played: 0, wins: 0, cur: 0, max: 0, dist: [0, 0, 0, 0, 0, 0], round: 0, srv: null });
const stats = () => Object.assign(blankStats(), ls.get(K_STATS, {}));
const save = () => ls.set(K_ROUND, R);

/* ---------- build UI ---------- */
const board = $('#board'), rows = [];
for (let r = 0; r < 6; r++) { const row = el('div', 'row'); row.setAttribute('role', 'row'); const cells = [];
  for (let c = 0; c < 5; c++) { const t = el('div', 'tile'); t.setAttribute('role', 'gridcell'); row.appendChild(t); cells.push(t); }
  board.appendChild(row); rows.push({ row, cells }); }
const KEYS = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'], keyEls = {};
KEYS.forEach((line, i) => { const kr = el('div', 'krow');
  if (i === 1) kr.appendChild(el('div', 'spacer'));
  line.split('').forEach(k => {
    const b = el('button', 'key' + (k === '+' || k === '-' ? ' wide' : ''), k === '+' ? 'ENTER' : k === '-' ? '⌫' : k); b.type = 'button';
    b.dataset.key = k === '+' ? 'Enter' : k === '-' ? 'Backspace' : k;
    if (k === '-') b.setAttribute('aria-label', 'Delete');
    b.addEventListener('click', e => { e.preventDefault(); press(b.dataset.key); b.blur(); });
    kr.appendChild(b); if (k.length === 1 && /[a-z]/.test(k)) keyEls[k] = b; });
  if (i === 1) kr.appendChild(el('div', 'spacer'));
  $('#kb').appendChild(kr); });
function fit() {
  const m = $('#main'), w = m.clientWidth - 16, h = m.clientHeight - 12;
  const t = Math.floor(Math.max(30, Math.min(64, (w - 4 * 6) / 5, (h - 5 * 6) / 6)));
  document.documentElement.style.setProperty('--t', t + 'px');
  document.documentElement.style.setProperty('--kh', Math.round(Math.max(42, Math.min(58, innerHeight * 0.068))) + 'px');
}
addEventListener('resize', fit);
const toast = (() => { let t; return (msg, ms) => { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(t); t = setTimeout(() => e.classList.remove('show'), ms || 1500); }; })();

function paintRow(r, word, res, animate) {
  const { cells } = rows[r];
  return new Promise(done => {
    for (let i = 0; i < 5; i++) { const t = cells[i]; t.textContent = word[i] || ''; t.className = 'tile' + (word[i] ? ' filled' : ''); }
    if (!res) return done();
    if (!animate) { cells.forEach((t, i) => { t.className = 'tile ' + res[i]; }); return done(); }
    cells.forEach((t, i) => setTimeout(() => {
      t.classList.add('flip'); setTimeout(() => { t.className = 'tile flip ' + res[i]; }, 250);
      if (i === 4) setTimeout(done, 520);
    }, i * 280));
  });
}
const resOf = i => R.pats[i].split('').map(c => PAT[c]);
const RANK = { absent: 1, present: 2, correct: 3 };
function paintKeys() {
  const best = {};
  (R ? R.guesses : []).forEach((g, gi) => resOf(gi).forEach((r, i) => { const k = g[i]; if (!best[k] || RANK[r] > RANK[best[k]]) best[k] = r; }));
  Object.keys(keyEls).forEach(k => { keyEls[k].className = 'key' + (best[k] ? ' ' + best[k] : ''); });
}
function paintLock() {
  const n = $('#lockNote'); n.innerHTML = '';
  const show = !R || R.status !== 'playing' || busy === 'start';
  n.classList.toggle('on', show);
  if (!show) return;
  if (!R || busy === 'start') { n.textContent = 'Fetching a word…'; return; }
  n.appendChild(document.createTextNode(R.status === 'won' ? '👑 Crowned' : '🌲 ' + R.answer.toUpperCase()));
  const b = el('button', 'nextbtn', 'Next word ▶'); b.type = 'button'; b.id = 'nextNote'; b.onclick = nextWord; n.appendChild(b);
}
function paintHeader() {
  const st = stats(), sv = R && R.mode === 'server' && st.srv && st.srv.nick === nick().toLowerCase() ? st.srv : null;
  $('#pNum').textContent = String(Math.max(1, st.round));
  $('#pStreak').textContent = String(sv ? sv.cur : st.cur); $('#pBest').textContent = String(sv ? sv.best : st.max);
  const m = $('#modeNote'); m.innerHTML = '';
  if (SRV === 'on' && nick()) { m.appendChild(document.createTextNode('🏆 Playing for the leaderboard as ' + nick() + ' · ')); const b = el('button', '', 'Change name'); b.type = 'button'; b.onclick = joinLB; m.appendChild(b); }
  else if (SRV === 'on') { m.appendChild(document.createTextNode('Practice mode · ')); const b = el('button', '', 'Join the leaderboard'); b.type = 'button'; b.onclick = joinLB; m.appendChild(b); }
  else if (SRV === 'missing') m.textContent = '🏆 Leaderboard coming online soon · practice words for now';
  else if (SRV === 'offline') m.textContent = 'Offline · practice words on this device';
  else if (SRV === 'unknown') m.textContent = '';
  else m.textContent = 'Practice words on this device';
}
function paintAll() {
  paintLock(); paintHeader();
  for (let r = 0; r < 6; r++) {
    if (R && r < R.guesses.length) paintRow(r, R.guesses[r], resOf(r), false);
    else paintRow(r, R && r === R.guesses.length && R.status === 'playing' ? input : '', null);
  }
  paintKeys();
}

/* ---------- rounds ---------- */
async function newRound() {
  if (busy) return;
  busy = 'start'; input = ''; clearTimeout(resTimer); closeModal();
  R = null; paintAll();
  const wait = lastStart + 3300 - Date.now(); if (wait > 0) await new Promise(r => setTimeout(r, wait));   // server allows a new word every 3 s
  let next = null;
  if (online()) {
    const r = await rpc('wu_start', { p_nickname: nick() }); lastStart = Date.now();
    if (r.ok && typeof r.data === 'string') next = { mode: 'server', id: r.data, nick: nick().toLowerCase(), guesses: [], pats: [], status: 'playing', answer: null, start: Date.now() };
    else if (r.missing) SRV = 'missing';
    else if (r.net) SRV = 'offline';
    else if (/rate limit/i.test(r.msg)) { busy = false; toast(/hour/.test(r.msg) ? '60 words an hour – take a break, ANON ☕' : 'One moment…', 2600); R = ls.get(K_ROUND, null); paintAll(); setTimeout(() => { if (!R || R.status !== 'playing') paintLock(); }, 10); return showRetry(); }
    else if (/nickname/i.test(r.msg)) { toast('That name can\'t go on the board. Practice word for now.', 2600); }
  }
  if (!next) {
    const pool = practicePool(), used = new Set(ss.get(K_USED, []).concat(ls.get(K_RECENT, [])));
    let cand = pool.filter(w => !used.has(w)); if (!cand.length) { ss.set(K_USED, []); ls.set(K_RECENT, []); cand = pool; }
    const w = cand[Math.floor(Math.random() * cand.length)];
    ss.set(K_USED, ss.get(K_USED, []).concat(w).slice(-1000)); ls.set(K_RECENT, ls.get(K_RECENT, []).concat(w).slice(-150));
    next = { mode: 'local', k: btoa(w.split('').reverse().join('')), guesses: [], pats: [], status: 'playing', answer: null, start: Date.now() };
  }
  const st = stats(); st.round++; ls.set(K_STATS, st);
  R = next; save(); busy = false; paintAll();
}
function showRetry() { const n = $('#lockNote'); n.classList.add('on'); n.innerHTML = ''; n.appendChild(document.createTextNode('Ready when you are'));
  const b = el('button', 'nextbtn', 'Next word ▶'); b.type = 'button'; b.onclick = nextWord; n.appendChild(b); }
function nextWord() { closeModal(); newRound(); }
async function joinLB() {
  if (!window.ANONLB) return;
  const v = await window.ANONLB.promptNickname({ title: '🏆 Your leaderboard name', text: 'Your win streak goes on the ANON Word Unlimited leaderboard under this name. No sign-up, no email.', skipLabel: 'Cancel', markOptOut: false });
  paintHeader();
  if (v && R && R.mode === 'local' && R.guesses.length === 0) { R = null; newRound(); }
  else if (v) toast('Your next word counts for the leaderboard 🏆', 2400);
}

/* ---------- input ---------- */
function press(k) {
  if (busy || !R || R.status !== 'playing' || $('#modal').classList.contains('show') || document.querySelector('.alb-ov') || document.querySelector('.anw-ov')) return;
  if (k === 'Enter') return submitGuess();
  if (k === 'Backspace') { input = input.slice(0, -1); return paintRow(R.guesses.length, input); }
  if (/^[a-z]$/.test(k) && input.length < 5) { input += k; paintRow(R.guesses.length, input); }
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && $('#modal').classList.contains('show')) return closeModal();
  if (e.key === 'Enter' && R && R.status !== 'playing' && !busy && !document.querySelector('.alb-ov,.anw-ov')) { e.preventDefault(); return nextWord(); }
  const k = e.key === 'Enter' ? 'Enter' : e.key === 'Backspace' ? 'Backspace' : (e.key || '').toLowerCase();
  if (k === 'Enter' || k === 'Backspace' || /^[a-z]$/.test(k)) { e.preventDefault(); press(k); }
});
function shake(msg) {
  const row = rows[R.guesses.length].row; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 520); toast(msg);
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
}
let lastGuess = 0, resTimer = 0;
async function submitGuess() {
  if (input.length < 5) return shake('Not enough letters');
  if (!VALID.has(input)) return shake('Not in word list');
  const g = input, r = R.guesses.length; let pat, done, won, answer, srv = null;
  busy = true;
  if (R.mode === 'server') {
    const wait = lastGuess + 750 - Date.now(); if (wait > 0) await new Promise(res => setTimeout(res, wait));
    const x = await rpc('wu_guess', { p_round: R.id, p_word: g }); lastGuess = Date.now();
    if (!x.ok) {
      busy = false;
      if (x.net) return toast('Network problem – tap Enter to try again', 2400);
      if (/slow down/i.test(x.msg)) return toast('Easy, ANON – one guess at a time', 1800);
      if (/round (finished|not found|expired)/i.test(x.msg)) { R.status = 'lost'; R.answer = R.answer || '?????'; save(); toast('That word timed out. Here\'s a new one.', 2400); return newRound(); }
      if (x.missing) { SRV = 'missing'; toast('Leaderboard went offline – new practice word', 2400); R = null; return newRound(); }
      return toast('Something went wrong – try again', 2000);
    }
    const d = x.data || {};
    if (d.valid === false) { busy = false; return shake('Not in word list'); }
    pat = d.pattern; done = !!d.done; won = !!d.solved; answer = d.answer || null;
    if (done) srv = { cur: d.streak || 0, best: d.best || 0, nick: nick().toLowerCase() };
  } else {
    const a = atob(R.k).split('').reverse().join('');
    pat = evaluate(g, a).map(x => x[0] === 'c' ? 'c' : x[0] === 'p' ? 'p' : 'a').join(''); won = g === a; done = won || r + 1 >= 6; answer = done ? a : null;
  }
  input = ''; R.guesses.push(g); R.pats.push(pat);
  if (done) finish(won, answer, srv);
  save();
  await paintRow(r, g, resOf(r), true);
  paintKeys(); busy = false; paintLock(); paintHeader();
  const FX = window.ANONWordFX;
  if (won) { rows[r].cells.forEach((t, i) => setTimeout(() => t.classList.add('win'), i * 90)); toast(FX ? FX.winMsg(r + 1) : 'Crowned! 👑', 1800); if (FX) setTimeout(() => FX.crown(board), 450); }
  else if (done) { toast((FX ? FX.loseMsg() : 'The forest wins this time') + ' · ' + answer.toUpperCase(), 2600); if (FX) FX.shadows(); }
  if (done) { const me = R; resTimer = setTimeout(() => { if (R === me) showResult(); }, won ? 1500 : 1800); if (window.ANONNews) window.ANONNews.gameOver({ delay: 4200 }); }
}
function finish(won, answer, srv) {
  R.status = won ? 'won' : 'lost'; R.answer = answer; R.end = Date.now();
  const st = stats(); st.played++;
  if (won) { st.wins++; st.dist[R.guesses.length - 1]++; st.cur++; st.max = Math.max(st.max, st.cur); } else st.cur = 0;
  if (srv) st.srv = srv;
  ls.set(K_STATS, st);
}

/* ---------- leaderboard ---------- */
const openLB = () => {
  if (SRV === 'missing') return openModal(p => { p.appendChild(el('h2', '', '🏆 Leaderboard')); p.appendChild(el('p', '', 'The ANON Word Unlimited leaderboard is coming online soon. Until then your words are practice and your streak is kept on this device.'));
    const a = el('p', 'dailylink'); a.innerHTML = 'Want a board today? Play the <a href="' + DAILY_URL + '">Daily ANON Word</a>.'; p.appendChild(a); });
  if (window.ANONLB) window.ANONLB.openBoard(GAME, { title: TITLE + ' · best streak', periods: ['day', 'all'], scoreLabel: 'Streak', movesLabel: 'guesses', hideMode: true });
};

/* ---------- modals ---------- */
function openModal(build) {
  const p = $('#panel'); p.innerHTML = '';
  const x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.onclick = closeModal; p.appendChild(x);
  build(p); $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); $('#panel').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function exRow(word, cls) { const d = el('div', 'ex'); word.split('').forEach((c, i) => d.appendChild(el('div', 'tile filled' + (cls[i] ? ' ' + cls[i] : ''), c))); return d; }
function showHelp() {
  openModal(p => {
    p.appendChild(el('h2', '', 'How to play'));
    p.appendChild(el('p', '', 'Guess the hidden 5-letter word in 6 tries. Then tap Next word for another one. Play as many as you like.'));
    p.appendChild(exRow('crown', ['correct'])); p.appendChild(el('p', 'small', 'C is in the word and in the right spot (gold).'));
    p.appendChild(exRow('pixel', ['', '', '', 'present'])); p.appendChild(el('p', 'small', 'E is in the word but in another spot (pink).'));
    p.appendChild(exRow('ghost', ['', '', 'absent'])); p.appendChild(el('p', 'small', 'O is not in the word at all (grey).'));
    p.appendChild(el('p', '', 'Leaderboard: set a name and win words in a row. Your best win streak goes on the board. A lost word, or leaving a word unfinished, resets the streak.'));
    const r = el('div', 'btnrow'), b = el('button', 'btn pri', "Let's play"); b.onclick = closeModal; r.appendChild(b); p.appendChild(r);
  });
  ls.set(K_SEEN, 1);
}
function showResult() {
  const st = stats(), done = R && R.status !== 'playing', sv = done && R.mode === 'server' ? st.srv : null;
  openModal(p => {
    if (done) {
      const img = el('img', 'res-art'); img.src = '../assets/logo.webp'; img.alt = 'ANON hooded figure'; p.appendChild(img);
      p.appendChild(el('h2', '', R.status === 'won' ? 'Crowned! 👑' : 'The forest wins this time'));
      const w = el('div', 'res-word' + (R.status === 'lost' ? ' lost' : '')); R.answer.split('').forEach(c => w.appendChild(el('span', '', c.toUpperCase()))); p.appendChild(w);
      p.appendChild(el('div', 'res-msg', R.status === 'won' ? 'Solved in ' + R.guesses.length + '/6' : 'The word was ' + R.answer.toUpperCase()));
      if (sv) p.appendChild(el('p', 'small', '🏆 Leaderboard streak ' + sv.cur + ' · best ' + sv.best + (R.status === 'won' ? '. Keep it going!' : '.')));
      else if (SRV === 'missing') p.appendChild(el('p', 'small', '🏆 Leaderboard coming online soon. This was a practice word.'));
    } else p.appendChild(el('h2', '', 'Statistics'));
    p.appendChild(el('h3', '', done ? 'Your Unlimited stats' : 'Your record'));
    const g = el('div', 'stats');
    [[st.played, 'Played'], [st.played ? Math.round(st.wins / st.played * 100) : 0, 'Win %'], [st.cur, 'Current streak'], [st.max, 'Best streak']].forEach(([v, l]) => { const s = el('div', 'stat'); s.appendChild(el('b', '', String(v))); s.appendChild(el('span', '', l)); g.appendChild(s); });
    p.appendChild(g);
    p.appendChild(el('h3', '', 'Guess distribution'));
    const d = el('div', 'dist'), mx = Math.max(1, ...st.dist);
    st.dist.forEach((v, i) => { const r = el('div', 'dr' + (done && R.status === 'won' && R.guesses.length === i + 1 ? ' me' : '')); r.appendChild(el('i', '', String(i + 1)));
      const b = el('div', 'bar', String(v)); b.style.width = Math.max(8, v / mx * 100) + '%'; r.appendChild(b); d.appendChild(r); });
    p.appendChild(d);
    const row = el('div', 'btnrow');
    const lb = el('button', 'btn', '🏆 Board'); lb.onclick = openLB; row.appendChild(lb);
    if (done) { const sh = el('button', 'btn', 'Share 📤'); sh.id = 'shareBtn'; sh.onclick = share; row.appendChild(sh);
      const nx = el('button', 'btn pri', 'Next word ▶'); nx.id = 'nextBtn'; nx.onclick = nextWord; row.appendChild(nx); }
    p.appendChild(row);
    if (done) { const cm = el('div'); p.appendChild(cm); challenge(cm); }
    const dl = el('div', 'dailylink'); dl.innerHTML = 'Also try today\'s <a href="' + DAILY_URL + '">Daily ANON Word</a> 📅'; p.appendChild(dl);
  });
}

/* Challenge a friend (shared/challenge.js): shares the win streak, emoji grid only */
function challenge(mount) {
  const C = window.ANONChallenge; if (!C) return setTimeout(() => { if (mount.isConnected) challenge(mount); }, 300);
  const st = stats(), won = R.status === 'won', best = R.mode === 'server' && st.srv ? st.srv.best : st.max, n = won ? streakNow() : best;
  if (!n) { C.manual(GAME); return; }
  const E = { c: '🟨', p: '🟪', a: '⬛' }, grid = R.pats.map(p => p.split('').map(c => E[c]).join('')).join('\n');
  const text = (won ? "I'm on a " + n + '-word win streak' : 'My best win streak is ' + n + ' words') + ' on ANON Word Unlimited 🔥 Think you can beat me? #ANONArcade\n\n' + grid;
  C.onGameOver({ game: GAME, score: n, mount, text, label: 'Streak' });
}
/* ---------- share ---------- */
function streakNow() { const st = stats(); return R && R.mode === 'server' && st.srv ? st.srv.cur : st.cur; }
function shareText() {
  const E = { c: '🟨', p: '🟪', a: '⬛' };
  const grid = R.pats.map(p => p.split('').map(c => E[c]).join('')).join('\n');
  return 'ANON Word Unlimited – streak ' + streakNow() + '\n\n' + grid + '\n\n' + LINK;
}
async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext && !FRAMED) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try { const ta = el('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
async function share() {
  const t = shareText(); window.__lastShare = t;
  if (matchMedia('(pointer:coarse)').matches && navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  if (await copyText(t)) { toast('Copied! Paste it anywhere 📋', 2000); return; }
  openModal(p => { p.appendChild(el('h2', '', 'Copy your result')); p.appendChild(el('p', 'small', 'Press and hold, then Copy.'));
    const ta = el('textarea', 'copybox'); ta.value = t; ta.readOnly = true; p.appendChild(ta); setTimeout(() => { ta.focus(); ta.select(); }, 50); });
}

$('#helpBtn').onclick = showHelp;
$('#statsBtn').onclick = showResult;
$('#lbBtn').onclick = openLB;

/* ---------- start ---------- */
async function init() {
  fit(); R = ls.get(K_ROUND, null);
  if (R && !(Array.isArray(R.guesses) && Array.isArray(R.pats) && R.guesses.length === R.pats.length)) R = null;
  paintAll();
  await probe();
  // a saved server round needs the server; a saved round from another name can't continue
  if (R && R.status === 'playing' && R.mode === 'server' && (!online() || R.nick !== nick().toLowerCase())) R = null;
  if (R && R.status === 'playing' && R.mode === 'local' && R.guesses.length === 0 && online()) R = null;   // untouched practice word: swap for a real one
  paintAll();
  if (!ls.get(K_SEEN, 0)) showHelp();
  if (!R || R.status !== 'playing') { if (!R) newRound(); }
  paintAll();
}
init();
window.ANON_WORDU = { version: '1.0.2', state: () => JSON.parse(JSON.stringify(R)), srv: () => SRV, stats, shareText: () => shareText(), next: nextWord, busy: () => busy, evaluate, valid: w => VALID.has(w) };
})();
</script>
